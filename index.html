      const au = $("[data-auto]", P); if (au) au.onclick = () => { Settings.set("theme", S("theme") === "auto" ? effectiveTheme() : "auto"); render(); };
      $$("[data-unpin]", P).forEach(e => e.onclick = () => { Settings.set("pinned", S("pinned").filter(x => x !== e.dataset.unpin)); render(); });
      $$("[data-sp]", P).forEach(e => e.onclick = () => { const sp = S("startPinned"); Settings.set("startPinned", sp.includes(e.dataset.sp) ? sp.filter(x => x !== e.dataset.sp) : [...sp, e.dataset.sp]); render(); });
      $$("[data-open]", P).forEach(e => e.onclick = () => launch(e.dataset.open));
      $$("[data-uninst]", P).forEach(e => e.onclick = async () => { await Store.uninstall(e.dataset.uninst); render(); });
      $$("[data-undef]", P).forEach(e => e.onclick = () => { const d = { ...S("defaultApps") }; delete d[e.dataset.undef]; Settings.set("defaultApps", d); render(); });
      $$("[data-prun]", P).forEach(e => e.onclick = () => { const p = JSON.parse(localStorage.getItem("axos.compatInstalled") || "[]")[+e.dataset.prun]; p && openPath(p.path); });
      $$("[data-prm]", P).forEach(e => e.onclick = async () => { const ps = JSON.parse(localStorage.getItem("axos.compatInstalled") || "[]"); const p = ps[+e.dataset.prm]; if (!p || !(await Dialog.confirm(`Uninstall ${p.name}?`, "This removes the program and its files from the AxCompat C: drive.", { ok: "Uninstall", danger: true }))) return; try { FS.rm(p.dir); } catch (er) { } FS.list(Desktop.dir).forEach(i => { if (extOf(i.name) === "lnk" && FS.readText(i.path).includes(p.path)) FS.rm(i.path); }); ps.splice(+e.dataset.prm, 1); localStorage.setItem("axos.compatInstalled", JSON.stringify(ps)); render(); });

      $$("[data-pw]", P).forEach(e => e.onclick = () => Power[e.dataset.pw]());

      q(".fs", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());

      q(".av", async () => { const p = await FilePicker.open({ title: "Choose a picture", start: FS.home + "/Pictures", filters: ["png", "jpg", "jpeg", "gif", "webp", "svg"], filterLabel: "Images" }); if (!p) return; const n = FS.node(p); const r = new FileReader(); r.onload = () => { Settings.set("avatar", r.result); render(); Start.render(); }; r.readAsDataURL(new Blob([n.content], { type: n.mime || MIME[extOf(p)] })); });

        Settings.set("password", a); render(); notify("Password updated", "You'll need it to sign in from now on.", "settings");

    const B = win.body; let src = args.source || localStorage.getItem("axos.gdSource") || "site";
    win.extra.innerHTML = `<button class="ibtn sm-src" data-tip="Game source" style="width:30px;height:30px">${ic("layers")}</button><button class="ibtn sm-rl" data-tip="Reload" style="width:30px;height:30px">${ic("refresh")}</button><button class="ibtn sm-fs" data-tip="Full screen" style="width:30px;height:30px">${ic("maximize")}</button>`;
    const show = async () => {
      B.innerHTML = `<div style="flex:1;position:relative;background:#000"><div class="empty-state" style="position:absolute;inset:0;color:#ccc"><div class="spinner"></div><div class="msg">Loading Geometry Dash…</div><div class="progress" style="width:240px"><i style="width:0"></i></div></div></div>`;
      const host = B.firstElementChild; const msg = $(".msg", B), bar = $(".progress i", B);
      const frame = (setup) => { const f = document.createElement("iframe"); f.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-write"); f.setAttribute("allowfullscreen", ""); f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"; setup(f); host.appendChild(f); f.onload = () => $(".empty-state", host)?.remove(); return f; };
      if (src === "site") {
        if (!navigator.onLine) return offline();
        msg.textContent = "Connecting to gd-webport.pages.dev…"; bar.parentElement.classList.add("indet");
        frame(f => { f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads"); f.src = GD.site; });
      } else {
        let cached = await IDB.get("gd-cache"); let html = cached?.html;
        if (!html || args.refresh) { try { msg.textContent = `Downloading from GitHub (${GD.repo})…`; html = await GD.fetchFork((g, t) => { bar.style.width = Math.min(100, g / t * 100) + "%"; msg.textContent = `Downloading from GitHub… ${fmtSize(g)} of ${fmtSize(t)}`; }); } catch (e) { if (!html) return offline(e.message); } }
        frame(f => { f.setAttribute("sandbox", "allow-scripts allow-pointer-lock allow-modals allow-forms"); f.srcdoc = html; });
      }
    };
    const offline = (why) => { B.innerHTML = `<div class="empty-state" style="background:#0b0b0f;color:#ccc">${ic("wifiOff")}<div>Geometry Dash needs an internet connection to load its game files.</div><div class="dim" style="font-size:12px">${esc(why || "You appear to be offline.")}</div><button class="btn primary rt">Try again</button></div>`; $(".rt", B).onclick = show; };
    $(".sm-rl", win.extra).onclick = () => show();
    $(".sm-fs", win.extra).onclick = () => { const f = $("iframe", B); (f || B).requestFullscreen?.(); };
    $(".sm-src", win.extra).onclick = e => Menu.at(e.currentTarget, [
      { label: "Live site (gd-webport.pages.dev)", checked: src === "site", action: () => { src = "site"; localStorage.setItem("axos.gdSource", src); show(); } },
      { label: "Your GitHub fork (via jsDelivr)", checked: src === "fork", action: () => { src = "fork"; localStorage.setItem("axos.gdSource", src); show(); } },
      { label: "Update fork copy now", icon: "download", disabled: src !== "fork", action: () => { args.refresh = true; show(); args.refresh = false; } }, "-",
      { label: "Open repository on GitHub", icon: "external", action: () => launch("browser", { url: "https://github.com/" + GD.repo }) },
    ]);
    show();
  },
});

<script>
/* =====================================================================
   Lagoon Merge — an original slide-and-merge puzzle for AxOS.
   5×5 lagoon, creatures evolve when two of a kind collide, rocks wash in
   and act as walls (merge beside them to break them), pearls remove tiles.
   ===================================================================== */
const LAGOON_TIERS = [["🫧", "Bubble", "#7dd3fc", "#0284c7"], ["🦐", "Shrimp", "#fda4af", "#e11d48"], ["🐟", "Fish", "#93c5fd", "#2563eb"], ["🐠", "Reef fish", "#fde68a", "#d97706"], ["🐡", "Puffer", "#fcd34d", "#b45309"], ["🦀", "Crab", "#fb923c", "#c2410c"], ["🦑", "Squid", "#f9a8d4", "#be185d"], ["🐙", "Octopus", "#c4b5fd", "#7c3aed"], ["🐢", "Turtle", "#86efac", "#15803d"], ["🐬", "Dolphin", "#67e8f9", "#0e7490"], ["🐋", "Whale", "#a5b4fc", "#3730a3"], ["🦎", "Axolotl", "#ffb3cf", "#db2777"]];
registerApp("lagoon", {
  name: "Lagoon Merge", icon: "wave", colors: ["#38bdf8", "#0f4c5c"], w: 520, h: 700, minW: 360, minH: 520, category: "Games", keywords: "puzzle merge game lagoon axolotl tiles",
  desc: "Slide, merge and evolve sea creatures up to the axolotl.",
  launch(win) {
    const B = win.body, N = 5; let grid, score, moves, pearls, best = +(localStorage.getItem("axos.lagoonBest") || 0), bestTier = +(localStorage.getItem("axos.lagoonTier") || 0), over, won, targeting = false, nid = 1, tilesEl = new Map(), history = null;
    B.innerHTML = `<div class="lagoon"><div class="hud"><div class="pill"><span>Score</span><b class="sc">0</b></div><div class="pill"><span>Best</span><b class="bs">0</b></div><div class="pill"><span>Pearls</span><b class="pl">0</b></div><div class="pill"><span>Tide</span><b class="td">8</b></div></div>
      <div class="board"></div><div class="ladder"></div>
      <div class="row" style="gap:8px"><button class="btn sm up">${ic("undo")} Undo</button><button class="btn sm pr">🫧 Use pearl</button><button class="btn sm nw">${ic("refresh")} New game</button><button class="btn sm hp">${ic("help")} How to play</button></div></div>`;
    const board = $(".board", B);
    const cellPos = (i) => { const pad = 8, gap = 7, inner = board.clientWidth - pad * 2, sz = (inner - gap * (N - 1)) / N; return { x: pad + (i % N) * (sz + gap), y: pad + Math.floor(i / N) * (sz + gap), sz }; };
    const empties = () => grid.map((c, i) => c ? -1 : i).filter(i => i >= 0);
    const spawn = (rock = false) => { const e = empties(); if (!e.length) return; const i = e[Math.floor(Math.random() * e.length)]; grid[i] = rock ? { id: nid++, rock: true, fresh: true } : { id: nid++, t: Math.random() < .14 ? 1 : 0, fresh: true }; };
    const reset = () => { grid = Array(N * N).fill(null); score = 0; moves = 0; pearls = 0; over = false; won = false; history = null; tilesEl.forEach(e => e.remove()); tilesEl.clear(); spawn(); spawn(); render(); };
    const lines = (dir) => { const L = []; for (let a = 0; a < N; a++) { const l = []; for (let b = 0; b < N; b++) { const r = dir === "up" || dir === "down" ? (dir === "up" ? b : N - 1 - b) : a; const c = dir === "left" || dir === "right" ? (dir === "left" ? b : N - 1 - b) : a; l.push(r * N + c); } L.push(l); } return L; };
    const neighbors = i => [i - N, i + N, i % N ? i - 1 : -1, i % N < N - 1 ? i + 1 : -1].filter(j => j >= 0 && j < N * N);
    const canMove = () => { if (empties().length) return true; for (let i = 0; i < N * N; i++) { const c = grid[i]; if (!c || c.rock) continue; if (i % N < N - 1 && grid[i + 1] && !grid[i + 1].rock && grid[i + 1].t === c.t) return true; if (i + N < N * N && grid[i + N] && !grid[i + N].rock && grid[i + N].t === c.t) return true; } return false; };
    const move = (dir) => {
      if (over || targeting) return; const snapshot = { grid: grid.map(c => c && { ...c }), score, moves, pearls };
      let changed = false; const mergedAt = [];
      grid.forEach(c => c && (delete c.merged, delete c.fresh));
      for (const line of lines(dir)) {
        let seg = [];
        const flush = () => { if (!seg.length) return; const items = seg.map(i => grid[i]).filter(Boolean); const out = []; for (let k = 0; k < items.length; k++) { const it = items[k], nx = items[k + 1]; if (nx && it.t === nx.t && it.t < LAGOON_TIERS.length - 1) { const nt = it.t + 1; out.push({ id: it.id, t: nt, merged: true, gone: nx.id }); score += 2 ** (nt + 1); if (nt >= 5 && pearls < 3) pearls++; if (nt > bestTier) { bestTier = nt; localStorage.setItem("axos.lagoonTier", nt); } if (nt === LAGOON_TIERS.length - 1 && !won) won = true; k++; } else out.push(it); }
          seg.forEach((cellIdx, k) => { const nv = out[k] || null; if ((grid[cellIdx]?.id || 0) !== (nv?.id || 0) || nv?.merged) changed = true; grid[cellIdx] = nv; if (nv?.merged) mergedAt.push(cellIdx); }); seg = []; };
        for (const i of line) { if (grid[i]?.rock) flush(); else seg.push(i); }

      history = snapshot;
      for (const i of mergedAt) for (const j of neighbors(i)) if (grid[j]?.rock) { const el = tilesEl.get(grid[j].id); el && (el.style.transform = "scale(0)"); grid[j] = null; score += 25; }

      if (won === true) { won = "shown"; Sound.play("ding"); showMsg(`<div style="font-size:64px">🦎</div><h2 style="margin:0">You raised an axolotl!</h2><div style="opacity:.8">Score ${score.toLocaleString()} in ${moves} moves</div><button class="btn primary kc">Keep playing</button>`); }
      else if (over) showMsg(`<div style="font-size:48px">🌊</div><h2 style="margin:0">The lagoon is full</h2><div style="opacity:.8">Score ${score.toLocaleString()} · best creature ${LAGOON_TIERS[bestTier][0]} ${LAGOON_TIERS[bestTier][1]}</div><button class="btn primary kc">Play again</button>`, reset);
    };
    const showMsg = (html, after) => { const m = h(`<div class="msg">${html}</div>`); board.appendChild(m); $(".kc", m).onclick = () => { m.remove(); after && after(); win.el.focus(); }; };
    const render = () => {
      $(".sc", B).textContent = score.toLocaleString(); $(".bs", B).textContent = best.toLocaleString(); $(".pl", B).textContent = "🫧".repeat(pearls) || "0"; $(".td", B).textContent = 8 - (moves % 8);
      $(".up", B).disabled = !history; $(".pr", B).disabled = !pearls; $(".pr", B).classList.toggle("primary", targeting);
      if (!$(".cellbg", board)) for (let i = 0; i < N * N; i++) board.appendChild(h(`<div class="cellbg" data-c="${i}"></div>`));
      $$(".cellbg", board).forEach(c => { const p = cellPos(+c.dataset.c); Object.assign(c.style, { left: p.x + "px", top: p.y + "px", width: p.sz + "px", height: p.sz + "px" }); });
      const alive = new Set();
      grid.forEach((c, i) => {
        if (!c) return; alive.add(c.id); let el = tilesEl.get(c.id); const p = cellPos(i);
        if (!el) { el = h(`<div class="t new"><span class="e"></span><span class="n"></span></div>`); board.appendChild(el); tilesEl.set(c.id, el); el.onclick = () => { if (!targeting) return; const idx = grid.findIndex(x => x && x.id === c.id); if (idx < 0) return; history = { grid: grid.map(x => x && { ...x }), score, moves, pearls }; grid[idx] = null; pearls--; targeting = false; el.remove(); tilesEl.delete(c.id); over = false; Sound.play("trash"); render(); }; }
        else el.classList.remove("new");
        if (c.gone) { const g = tilesEl.get(c.gone); if (g) { Object.assign(g.style, { left: p.x + "px", top: p.y + "px", zIndex: 0 }); setTimeout(() => g.remove(), 130); tilesEl.delete(c.gone); } delete c.gone; }
        el.classList.toggle("rock", !!c.rock); el.classList.toggle("merged", !!c.merged); el.classList.toggle("target", targeting);
        const T = c.rock ? ["🪨", "Rock"] : LAGOON_TIERS[c.t]; $(".e", el).textContent = T[0]; $(".n", el).textContent = T[1];
        if (!c.rock) el.style.background = `linear-gradient(160deg,${T[2]},${T[3]})`;
        Object.assign(el.style, { left: p.x + "px", top: p.y + "px", width: p.sz + "px", height: p.sz + "px", zIndex: 1 });
      });
      tilesEl.forEach((el, id) => { if (!alive.has(id)) { el.remove(); tilesEl.delete(id); } });
      $(".ladder", B).innerHTML = LAGOON_TIERS.map((t, i) => `<span class="${i <= bestTier ? "got" : ""}" title="${t[1]}">${t[0]}</span>`).join("→");
    };
    win.el.tabIndex = -1;
    win.el.addEventListener("keydown", e => { const d = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" }[e.key]; if (d) { e.preventDefault(); move(d); } else if (e.key === "Escape" && targeting) { targeting = false; render(); } else if ((e.ctrlKey || e.metaKey) && e.key === "z") $(".up", B).click(); });
    let sx = null, sy = null; board.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; }); board.addEventListener("pointerup", e => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")); });
    $(".nw", B).onclick = () => { reset(); win.el.focus(); };
    $(".up", B).onclick = () => { if (!history) return; grid = history.grid; score = history.score; moves = history.moves; pearls = history.pearls; history = null; over = false; tilesEl.forEach(e => e.remove()); tilesEl.clear(); render(); win.el.focus(); };
    $(".pr", B).onclick = () => { if (!pearls) return; targeting = !targeting; render(); };
    $(".hp", B).onclick = () => Dialog.alert("How to play Lagoon Merge", "• Swipe or use the arrow keys to slide every creature.\n• Two identical creatures that bump into each other evolve: 🫧 → 🦐 → 🐟 → 🐠 → 🐡 → 🦀 → 🦑 → 🐙 → 🐢 → 🐬 → 🐋 → 🦎.\n• Every 8 moves the tide washes in a 🪨 rock. Rocks never move and block sliding. Merge right next to a rock to smash it (+25).\n• Evolving a Crab or better earns a pearl (max 3). Use a pearl, then tap any tile or rock to remove it.\n• Raise an axolotl to win, then keep going for a high score.", { icon: "help" });
    win.on("resize", debounce(() => grid && render(), 60));
    reset(); setTimeout(() => win.el.focus(), 50);
  },
});
</script>
<script>
/* =====================================================================
   Motion — physically based springs, FLIP window morphs, staggers,
   view-transition crossfades. Everything animates transform / opacity /
   filter only, so it stays on the compositor at full frame rate.
   ===================================================================== */
const Motion = {
  last: { x: 0, y: 0, t: 0 },
  spring: "cubic-bezier(.34,1.36,.64,1)", soft: "cubic-bezier(.22,1,.36,1)", bouncy: "cubic-bezier(.34,1.8,.64,1)", out: "cubic-bezier(.22,1,.36,1)", in: "cubic-bezier(.55,0,.9,.4)",
  on() { return Settings.get("animations") !== false && !matchMedia("(prefers-reduced-motion: reduce)").matches; },
  d(ms) { return ms / (Settings.get("animSpeed") || 1); },
  /* Simulate a damped spring and encode it as a CSS linear() easing */
  curve(k, c, m = 1) {
    let x = 0, v = 0, t = 0; const dt = 1 / 600, pts = [];
    while (t < 4) { const a = (-k * (x - 1) - c * v) / m; v += a * dt; x += v * dt; t += dt; pts.push(x); if (t > .1 && Math.abs(x - 1) < .0008 && Math.abs(v) < .004) break; }
    const n = 56, out = []; for (let i = 0; i <= n; i++) out.push(+(i === 0 ? 0 : i === n ? 1 : pts[Math.min(pts.length - 1, Math.round(i / n * (pts.length - 1)))]).toFixed(4));
    return `linear(${out.join(", ")})`;
  },
  init() {
    if (window.CSS?.supports?.("transition-timing-function", "linear(0, 0.5, 1)")) { this.spring = this.curve(230, 21); this.soft = this.curve(170, 26); this.bouncy = this.curve(320, 15); }
    const R = document.documentElement.style; R.setProperty("--spring", this.spring); R.setProperty("--spring-soft", this.soft); R.setProperty("--spring-bouncy", this.bouncy);
    document.addEventListener("pointerdown", e => { this.last = { x: e.clientX, y: e.clientY, t: performance.now() }; }, true);
  },
  vt(fn) { if (this.on() && document.startViewTransition && !document.hidden) { try { document.startViewTransition(fn); return; } catch (e) { } } fn(); },
  stagger(nodes, { y = 12, scale = .97, step = 22, dur = 560, max = 40, easing } = {}) {
    if (!this.on()) return; let i = 0;
    for (const n of nodes) { if (i >= max) break; n.animate([{ opacity: 0, transform: `translateY(${y}px) scale(${scale})` }, { opacity: 1, transform: "none" }], { duration: this.d(dur), delay: this.d(i * step), easing: easing || this.spring, fill: "backwards" }); i++; }
  },
  pop(el, from = .4) { if (!this.on()) return; el.animate([{ opacity: 0, transform: `scale(${from})` }, { opacity: 1, transform: "none" }], { duration: this.d(620), easing: this.bouncy, fill: "backwards" }); },
  /* window lifecycle */
  open(win) {

  },
  close(win) {
    const el = win.el; if (!this.on()) { el.remove(); return; }
    el.style.pointerEvents = "none"; el.getAnimations().forEach(a => a.cancel());
    const a = el.animate([{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "scale(.88) translateY(14px)", filter: "blur(6px)" }], { duration: this.d(260), easing: this.in, fill: "forwards" });
    a.onfinish = () => el.remove(); setTimeout(() => el.isConnected && el.remove(), this.d(600));
  },
  flip(win, fn) {
    const el = win.el; if (!this.on() || document.body.classList.contains("taskview-on")) { fn(); return; }
    const a = el.getBoundingClientRect(); el.getAnimations().forEach(x => x.cancel()); fn(); const b = el.getBoundingClientRect();
    if (!b.width || !b.height) return; const dx = a.left - b.left, dy = a.top - b.top, sx = a.width / b.width, sy = a.height / b.height;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .01 && Math.abs(sy - 1) < .01) return;
    el.animate([{ transformOrigin: "0 0", transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` }, { transformOrigin: "0 0", transform: "none" }], { duration: this.d(560), easing: this.soft });
  },
  dockTarget(win) { const b = $(`#taskbar .tb-btn[data-app="${win.app}"]`) || $("#start-btn"); return b ? b.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight, width: 0, height: 0 }; },
  minimize(win, done) {
    const el = win.el; if (!this.on()) { done(); return; }

    const s = Math.max(.04, Math.min(.14, r.width / w.width)); const tx = r.left + r.width / 2 - (w.left + w.width * s / 2), ty = r.top + r.height / 2 - (w.top + w.height * s / 2);
    const a = el.animate([{ transformOrigin: "0 0", transform: "none", opacity: 1, filter: "blur(0)" }, { transformOrigin: "0 0", transform: `translate(${tx * .6}px,${ty * .35}px) scale(${.5 + s / 2})`, opacity: .85, offset: .45, filter: "blur(1px)" }, { transformOrigin: "0 0", transform: `translate(${tx}px,${ty}px) scale(${s})`, opacity: 0, filter: "blur(4px)" }], { duration: this.d(480), easing: "cubic-bezier(.5,0,.2,1)" });

    const s = Math.max(.04, Math.min(.14, r.width / w.width)); const tx = r.left + r.width / 2 - (w.left + w.width * s / 2), ty = r.top + r.height / 2 - (w.top + w.height * s / 2);
    el.animate([{ transformOrigin: "0 0", transform: `translate(${tx}px,${ty}px) scale(${s})`, opacity: 0, filter: "blur(4px)" }, { transformOrigin: "0 0", transform: "none", opacity: 1, filter: "blur(0)" }], { duration: this.d(620), easing: this.spring });
  },
  /* desktop entrance after boot / unlock */
  reveal() {
    if (!this.on()) return;
    $("#desktop").animate([{ scale: "1.08", filter: "blur(16px) brightness(.55)" }, { scale: "1", filter: "blur(0) brightness(1)" }], { duration: this.d(1100), easing: this.soft });
