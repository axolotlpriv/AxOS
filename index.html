      $(".sts", bar).onclick = () => { showStats = !showStats; stEl.classList.toggle("hidden", !showStats); };
      $(".fs", bar).onclick = async () => { if (document.fullscreenElement) return document.exitFullscreen(); await W.requestFullscreen?.(); if (cur.mode === "gaming") navigator.keyboard?.lock?.().catch(() => { }); W.focus(); };
      $(".x", bar).onclick = () => end();
      setTimeout(() => { if (!closed) bar.style.opacity = .25; }, 4000);
      bar.onpointerenter = () => bar.style.opacity = 1;
      /* ---- stats ---- */
      let lastBytes = 0, lastT = 0;
      const statTimer = setInterval(async () => {
        send(ctl, { t: "ping", ts: performance.now() }); if (!showStats) return;
        const r = await pc.getStats(); let v = null, pair = null, codec = null, local = null, remote = null; const byId = {};
        r.forEach(s => { byId[s.id] = s; if (s.type === "inbound-rtp" && s.kind === "video") v = s; if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") pair = s; });
        if (v?.codecId) codec = byId[v.codecId]; if (pair) { local = byId[pair.localCandidateId]; remote = byId[pair.remoteCandidateId]; }
        const now = performance.now(); const mbps = v && lastT ? ((v.bytesReceived - lastBytes) * 8 / ((now - lastT) / 1000) / 1e6).toFixed(1) : "–"; if (v) { lastBytes = v.bytesReceived; lastT = now; }
        const route = local?.candidateType === "relay" || remote?.candidateType === "relay" ? "TURN relay" : local?.candidateType === "host" && remote?.candidateType === "host" ? "Direct (same network)" : "Direct (internet)";
        stEl.textContent = `${cur.mode === "gaming" ? "GAMING" : "WORK"} · ${hello.encoder ? "encoder " + hello.encoder : ""}\n${v?.frameWidth || "?"}×${v?.frameHeight || "?"} @ ${Math.round(v?.framesPerSecond || 0)} fps\n${mbps} Mbps · ${codec?.mimeType?.split("/")[1] || "?"}${v?.decoderImplementation ? " · " + v.decoderImplementation : ""}\nLatency ${cur.rtt ?? "–"} ms · loss ${v?.packetsLost ?? 0} · jitter ${v ? Math.round((v.jitter || 0) * 1000) : "–"} ms\n${route}`;
      }, 1000);
      const end = (msg) => {
        if (closed) return; closed = true; clearInterval(statTimer); cancelAnimationFrame(raf); send(ctl, { t: "release" });
        try { if (document.pointerLockElement === W) document.exitPointerLock(); if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { }
        try { pc.close(); } catch (e) { } sess = null;
        if (msg) { B.innerHTML = `<div class="empty-state" style="background:var(--surface)">${ic("wifiOff")}<div>${esc(msg)}</div><div class="row"><button class="btn primary re">Reconnect</button><button class="btn back">Back</button></div></div>`; $(".re", B).onclick = () => start(p, cur.mode); $(".back", B).onclick = home; } else home();
      };
      sess = { end }; W.focus();
    };
    win.on("close", () => sess?.end());
    const off = Bus.on("rd", () => { if (!sess && $(".add", B)) home(); }); win.on("close", off);
    let wasIn = Cloud.signedIn; const offC = Bus.on("cloud", () => { if (Cloud.signedIn !== wasIn) { wasIn = Cloud.signedIn; acct = null; acctErr = ""; if (wasIn) loadAcct(); else if (!sess && $(".add", B)) home(); } }); win.on("close", offC);
    const poll = setInterval(() => { if (!sess && Cloud.signedIn && $(".add", B) && !document.hidden) loadAcct(); }, 20000); win.on("close", () => clearInterval(poll));
    home(); loadAcct();
  },
});
</script>
<script>
/* =====================================================================
   AxOS Cloud — accounts and end-to-end encrypted cloud saves.
   Runs on the personal gateway worker (KV binding AXCLOUD). The password
   never leaves this device: it derives an auth key (sent) and a separate
   encryption key (kept). Saves are gzip-compressed, then AES-GCM encrypted.
   ===================================================================== */
const Cloud = {
  VOLATILE: /^axos\.(settings|gwHealth|recents|lastRun|tipShown|installed|migr\d|axplayInit)$/,
  st() { return { server: "", user: "", token: "", auto: true, lastSync: 0, version: 0, size: 0, ...(Settings.get("cloud") || {}) }; },
  set(p) { Settings.set("cloud", { ...this.st(), ...p }); Bus.emit("cloud"); },
  server(st = this.st()) { return (st.server || Settings.get("browser").workerUrl || "").trim().replace(/\/?$/, "/"); },
  get signedIn() { const s = this.st(); return !!(s.token && s.user); },
  async api(path, { method = "GET", body, headers = {}, raw = false, server } = {}) {
    const base = server || this.server(); if (!/^https?:\/\//.test(base)) throw new Error("Set up your personal gateway first (Settings → Network & Browser), or enter a cloud server address.");
    const st = this.st(); const hd = { ...headers }; if (st.token && !server) hd.authorization = "Bearer " + st.token;
    let res; try { res = await fetch(base + "cloud/" + path, { method, body, headers: hd }); } catch (e) { throw new Error("Couldn't reach the cloud server. Check your connection and the gateway address."); }
    if (raw && res.ok) return res;
    const j = await res.json().catch(() => ({ error: `Cloud server error (HTTP ${res.status}).` }));
    if (!res.ok) { const err = new Error(j.error || `HTTP ${res.status}`); err.status = res.status; err.meta = j.meta; if (res.status === 401 && !server) this.set({ token: "" }); throw err; }
    return j;
  },
  async keys(user, password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits", "deriveKey"]);
    const u = user.toLowerCase().trim();
    const auth = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("axos-auth:" + u), iterations: 200000 }, base, 256));
    const enc = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("axos-enc:" + u), iterations: 200000 }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    return { auth: Array.from(auth, b => b.toString(16).padStart(2, "0")).join(""), enc };
  },
  async encKey() { const raw = await IDB.get("cloudKey"); if (!raw) throw new Error("Sign in to AxOS Cloud again on this device."); return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]); },
  async signIn({ server, user, password, create = false }) {
    server = (server || this.server()).trim().replace(/\/?$/, "/");
    const k = await this.keys(user, password);
    const r = await this.api(create ? "signup" : "login", { method: "POST", server, body: JSON.stringify({ user: user.trim(), auth: k.auth }), headers: { "content-type": "application/json" } });
    await IDB.set("cloudKey", await crypto.subtle.exportKey("raw", k.enc));
    this.set({ server, user: r.user, token: r.token, version: 0, lastSync: 0 });
    return r;
  },
  async signOut() { try { await this.api("logout", { method: "POST" }); } catch (e) { } await IDB.del("cloudKey"); this.set({ token: "", user: "", version: 0, lastSync: 0 }); },
  /* ---- payload ---- */
  async pack() {
    const ls = {}; for (const k of Object.keys(localStorage)) if (k.startsWith("axos.") && !this.VOLATILE.test(k) && !k.startsWith("axos.pxStore.")) ls[k] = localStorage.getItem(k);
    const settings = { ...Settings.data }; delete settings.cloud;
    const json = JSON.stringify({ axos: AXOS_VERSION, date: Date.now(), device: Settings.get("hostname"), settings, ls, fs: Backup.enc(FS.root) });
    const gz = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.encKey(), gz));
    const out = new Uint8Array(4 + 12 + ct.length); out.set([0x41, 0x58, 0x43, 0x31]); out.set(iv, 4); out.set(ct, 16); return out;
  },
  async unpack(buf) {
    const b = new Uint8Array(buf); if (b[0] !== 0x41 || b[1] !== 0x58) throw new Error("This cloud save isn't in AxOS format.");
    let gz; try { gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(4, 16) }, await this.encKey(), b.subarray(16)); } catch (e) { throw new Error("Couldn't decrypt the cloud save. The password may have changed."); }
    return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  },
  /* ---- sync ---- */
  dirty: false, busy: false,
  async sync({ force = false, quiet = false } = {}) {
    if (!this.signedIn || this.busy) return; this.busy = true; Bus.emit("cloud");
    try {
      const body = await this.pack(); const st = this.st();
      let meta;
      try { meta = await this.api("save", { method: "PUT", body, headers: { "content-type": "application/octet-stream", "x-ax-base": String(st.version || 0), "x-ax-device": Settings.get("hostname"), ...(force ? { "x-ax-force": "1" } : {}) } }); }
      catch (e) {
        if (e.status !== 409) throw e;
        this.busy = false;
        const pick = await Dialog.open({ title: "Your cloud save changed", message: `AxOS Cloud has a newer save from ${e.meta?.device || "another device"} (${fmtDate(e.meta?.updated || Date.now())}). Which one do you want to keep?`, icon: "alert", buttons: [{ label: "Decide later", value: null }, { label: "Use the cloud copy", value: "cloud" }, { label: "Keep this device", primary: true, value: "local" }], cancelValue: null });
        if (pick === "local") return this.sync({ force: true, quiet }); if (pick === "cloud") return this.restore(); return;
      }
      this.dirty = false; this.set({ version: meta.version, lastSync: Date.now(), size: meta.size });
      if (!quiet) notify("Saved to AxOS Cloud", `${fmtSize(meta.size)} · encrypted`, "settings", { silent: true, timeout: 2500 });
    } catch (e) { if (!quiet) Dialog.alert("Couldn't sync", e.message, { icon: "errorC" }); else console.warn("Cloud sync:", e.message); }
    finally { this.busy = false; Bus.emit("cloud"); }
  },
  async restore({ confirm = true } = {}) {
    if (confirm && !(await Dialog.confirm("Restore from AxOS Cloud?", "Your files and settings on this device will be replaced by your cloud save, then AxOS restarts.", { icon: "alert", ok: "Restore" }))) return;
    const res = await this.api("save", { raw: true }); const meta = JSON.parse(res.headers.get("x-ax-meta") || "{}");
    const data = await this.unpack(await res.arrayBuffer()); const st = this.st(); window.AXOS_NO_SAVE = true;
    await IDB.set("fs", Backup.dec(data.fs));
    for (const [k, v] of Object.entries(data.ls || {})) localStorage.setItem(k, v);
    localStorage.setItem("axos.settings", JSON.stringify({ ...data.settings, setupDone: true, cloud: { ...st, version: meta.version || st.version, lastSync: Date.now(), size: meta.size || 0 } }));
    location.reload();
  },
  /* sync before shutdown / restart / sign out (bounded wait) */
  async beforeExit() { if (!this.signedIn || !this.st().auto || !this.dirty) return; await Promise.race([this.sync({ quiet: true }), sleep(8000)]); },
  init() {
    Bus.on("fs", () => { this.dirty = true; });
    Bus.on("setting", k => { if (k !== "cloud") this.dirty = true; });
    setInterval(() => { if (this.signedIn && this.st().auto && this.dirty && !Lock.locked) this.sync({ quiet: true }); }, 10 * 60 * 1000);
  },
  /* ---- Settings UI ---- */
  panel() {
    const st = this.st(); const srv = this.server(st);
    if (!this.signedIn) return `<h3>AxOS Cloud</h3><div class="srow stack"><div class="d muted" style="font-size:12.5px;line-height:1.55;margin-bottom:10px">Sign in to back up your files, settings, games and saved PCs, and restore them on any device. Everything is encrypted on this device before upload, so not even the server can read it. <b>If you forget your password, your cloud data can't be recovered.</b></div>
      <div class="col" style="gap:8px;max-width:440px"><input class="input cl-srv" placeholder="Cloud server (your personal gateway address)" value="${esc(st.server || Settings.get("browser").workerUrl || "")}"><input class="input cl-user" placeholder="Username" autocomplete="username" value="${esc(st.user || "")}"><input class="input cl-pass" type="password" placeholder="Password (at least 8 characters)" autocomplete="current-password"><div class="row" style="flex-wrap:wrap"><button class="btn primary cl-in">Sign in</button><button class="btn cl-up">Create account</button></div><div class="cl-err" style="font-size:12px;color:var(--danger);min-height:16px"></div></div>
      <div class="dim" style="font-size:12px">The cloud runs on your personal gateway. Set it up under Network &amp; Browser, then add a KV namespace binding named <code>AXCLOUD</code> to the worker in Cloudflare.</div></div>`;
    return `<h3>AxOS Cloud</h3><div class="srow"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff">${ic("cloud")}</div><div class="tx"><div class="t">Signed in as <b>${esc(st.user)}</b></div><div class="d">${this.busy ? "Syncing…" : st.lastSync ? `Last synced ${timeAgo(st.lastSync)} · ${fmtSize(st.size)} encrypted` : "Not synced yet"} · ${esc(new URL(srv).host)}</div></div><button class="btn primary cl-sync" ${this.busy ? "disabled" : ""}>${ic("refresh")} Sync now</button></div>
      ${row_("refresh", "Sync automatically", "Every 10 minutes when something changes, and before shutting down", `<span class="switch${st.auto ? " on" : ""} cl-auto"></span>`)}${row_("download", "Restore from the cloud", "Replace this device's files and settings with your cloud save", `<button class="btn cl-restore">Restore</button>`)}${row_("logout", "Sign out of AxOS Cloud", "Your files stay on this device", `<button class="btn cl-out">Sign out</button>`)}`;
  },
  wire(P, rerender) {
    const q = (s, f) => { const e = $(s, P); if (e) e.onclick = f; };
    const go = async create => {
      const err = $(".cl-err", P); err.textContent = ""; const server = $(".cl-srv", P).value, user = $(".cl-user", P).value.trim(), password = $(".cl-pass", P).value;
      if (!user || password.length < 8) { err.textContent = "Enter a username and a password of at least 8 characters."; return; }
      const btn = $(create ? ".cl-up" : ".cl-in", P); btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px"></span>`;
      try {
        const r = await this.signIn({ server, user, password, create });
        if (!create && r.meta && await Dialog.confirm("Restore your cloud save?", `Your account has a save from ${r.meta.device || "another device"} (${fmtDate(r.meta.updated)}, ${fmtSize(r.meta.size)}). Restore it on this device now?\n\nChoose "Not now" to keep this device's files; your next sync will ask which copy to keep.`, { ok: "Restore", cancel: "Not now" })) return this.restore({ confirm: false });
        if (create) await this.sync({ quiet: true });
        notify("Signed in to AxOS Cloud", r.user, "settings", { silent: true }); rerender();
      } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = create ? "Create account" : "Sign in"; }
    };
    q(".cl-in", () => go(false)); q(".cl-up", () => go(true));
    $$(".cl-srv,.cl-user,.cl-pass", P).forEach(i => i.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") go(false); });
    q(".cl-sync", async () => { await this.sync(); rerender(); });
    q(".cl-auto", () => { this.set({ auto: !this.st().auto }); rerender(); });
    q(".cl-restore", () => this.restore().catch(e => Dialog.alert("Couldn't restore", e.message, { icon: "errorC" })));
    q(".cl-out", async () => { if (await Dialog.confirm("Sign out of AxOS Cloud?", "Sync first so your latest changes are saved?", { ok: "Sync and sign out", cancel: "Cancel" })) { await this.sync({ quiet: true }); await this.signOut(); rerender(); } });
  },
  /* Restore during first-run setup */
  async oobeRestore() {
    const body = h(`<div class="col" style="margin-top:10px;gap:8px"><input class="input srv" placeholder="Cloud server (your personal gateway address)" value="${esc(Settings.get("browser").workerUrl || "")}"><input class="input usr" placeholder="Username"><input class="input pw" type="password" placeholder="Password"><div class="er" style="font-size:12px;color:var(--danger);min-height:16px"></div></div>`);
    await Dialog.open({ title: "Restore from AxOS Cloud", message: "Sign in to bring back your files, settings and apps.", body, buttons: [{ label: "Cancel", value: false }, { label: "Restore", primary: true, keepOpen: true, value: (dlg) => {
      const er = $(".er", body); er.textContent = "Signing in…";
      Settings.patch("browser", { workerUrl: Settings.get("browser").workerUrl || $(".srv", body).value.trim() });
      this.signIn({ server: $(".srv", body).value, user: $(".usr", body).value, password: $(".pw", body).value })
        .then(r => { if (!r.meta) { er.textContent = "Signed in, but this account has no cloud save yet."; return; } er.textContent = "Restoring…"; return this.restore({ confirm: false }); })
        .catch(e => { er.textContent = e.message; });
      return undefined;
    } }] });
  },
};
function row_(icon, t, d, ctl) { return `<div class="srow">${ic(icon)}<div class="tx"><div class="t">${t}</div><div class="d">${d}</div></div>${ctl}</div>`; }
Cloud.init();
</script>
<script>
/* =====================================================================
   Boot
   ===================================================================== */
window.addEventListener("error", e => { console.error(e.error || e.message); if (!Shell.started || /ResizeObserver|Script error/.test(e.message)) return; const k = String(e.message); if (Shell._lastErr === k) return; Shell._lastErr = k; notify("Something went wrong", k.slice(0, 160), "taskmgr", { silent: true }); });
window.addEventListener("unhandledrejection", e => console.warn("Unhandled:", e.reason));
(async function main() {
  applyTheme();
  if (!localStorage.getItem("axos.installed")) localStorage.setItem("axos.installed", String(Date.now()));
  await bootSequence();
  if (!localStorage.getItem("axos.migr2")) { localStorage.setItem("axos.migr2", "1"); const sp = Settings.get("startPinned"); ["axplay", "gdash"].forEach(a => { if (!sp.includes(a)) sp.splice(4, 0, a); }); Settings.set("startPinned", sp); const tp = Settings.get("pinned"); if (!tp.includes("axplay")) Settings.set("pinned", [...tp, "axplay"]); FS.mkdir(FS.home + "/Games", true); }
  if (!localStorage.getItem("axos.migr3")) { localStorage.setItem("axos.migr3", "1"); if (Settings.get("accent") === "#4f8cff" && Settings.get("wallpaper") === "aurora") { Settings.set("accent", "#e8679f"); Settings.set("wallpaper", "axolotl"); Settings.set("preset", "default"); } const sp = Settings.get("startPinned"); if (!sp.includes("lagoon")) { sp.splice(6, 0, "lagoon"); Settings.set("startPinned", sp); } const d = AxPlay.get(); if (d.games.length && !d.games.find(g => g.id === "lagoon")) { d.games.push({ ...AXPLAY_CATALOG.find(c => c.id === "lagoon"), added: Date.now(), playtime: 0, compat: "auto", opts: "" }); AxPlay.save(d); } }
  if (!localStorage.getItem("axos.migr4")) { localStorage.setItem("axos.migr4", "1"); const sp = Settings.get("startPinned"); if (!sp.includes("remote")) { sp.splice(5, 0, "remote"); Settings.set("startPinned", sp); } }
  Taskbar.init(); Desktop.init(); Widgets.render(); ScreenSaver.init(); applyTheme();
  if (!Settings.get("setupDone")) { await runOOBE(); Desktop.render(); Taskbar.renderApps(); Sound.play("startup"); Motion.reveal(); }
  else if (Settings.get("lockOnBoot") || Settings.get("password")) await Lock.show();
  else { Sound.play("startup"); Motion.reveal(); }
  Shell.started = true;
  if (!localStorage.getItem("axos.noWelcome")) launch("welcome");
  if (!localStorage.getItem("axos.tipShown")) { localStorage.setItem("axos.tipShown", "1"); setTimeout(() => Notify.push({ app: "compat", title: "Try running a program", body: "Open ~/Projects and double-click AxDemo.exe or axhello.", actions: [{ label: "Open Projects", primary: true, action: () => launch("explorer", { path: FS.home + "/Projects" }) }] }), 2500); }
})();
</script>
