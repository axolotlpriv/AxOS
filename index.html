<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AxOS</title>
<meta name="description" content="AxOS — a complete desktop operating system that runs in a single HTML file.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%224%22%20y1%3D%224%22%20x2%3D%2260%22%20y2%3D%2260%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23e8679f%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23f0884f%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2226%22%20height%3D%2226%22%20rx%3D%227.5%22%20fill%3D%22url%28%23g%29%22/%3E%3Crect%20x%3D%2234%22%20y%3D%224%22%20width%3D%2226%22%20height%3D%2226%22%20rx%3D%227.5%22%20fill%3D%22url%28%23g%29%22%20opacity%3D%22.82%22/%3E%3Crect%20x%3D%224%22%20y%3D%2234%22%20width%3D%2226%22%20height%3D%2226%22%20rx%3D%227.5%22%20fill%3D%22url%28%23g%29%22%20opacity%3D%22.82%22/%3E%3Crect%20x%3D%2238.5%22%20y%3D%2238.5%22%20width%3D%2217%22%20height%3D%2217%22%20rx%3D%224.5%22%20fill%3D%22url%28%23g%29%22%20transform%3D%22rotate%2845%2047%2047%29%22/%3E%3C/svg%3E">
<style>
/* =====================================================================
   AxOS — design tokens
   ===================================================================== */
:root{
  --accent:#4f8cff; --accent-2:#8b5cf6; --accent-rgb:79,140,255;
  --font: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Inter","Ubuntu","Cantarell","Helvetica Neue",Arial,sans-serif;
  --mono: "Cascadia Code","JetBrains Mono","Fira Code",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --scale:1;
  --radius:10px; --radius-sm:6px; --radius-lg:14px;
  --tb-h:48px; --tb-space:var(--tb-h); --glass-a:.72; --blur:30px; --spd:1; --icon-r:.26;
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur:.18s;
}
:root,[data-theme=dark]{
  --text:#f3f3f6; --text-2:#b4b4c0; --text-3:#80808e;
  --glass:rgba(30,30,36,var(--glass-a)); --glass-2:rgba(44,44,52,calc(var(--glass-a) + .1));
  --surface:#1c1c21; --surface-2:#24242a; --surface-3:#2d2d35; --surface-4:#383842;
  --hover:rgba(255,255,255,.07); --active:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
  --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --win-bg:#202026; --win-tb:#1b1b20; --win-tb-inactive:#222228;
  --input:#16161a; --scroll:rgba(255,255,255,.18);
  --danger:#ff5c6c; --ok:#3ecf8e; --warn:#ffb547;
  color-scheme:dark;
}
[data-theme=light]{
  --text:#1b1b22; --text-2:#55556a; --text-3:#8a8a9a;
  --glass:rgba(246,246,250,var(--glass-a)); --glass-2:rgba(255,255,255,calc(var(--glass-a) + .1));
  --surface:#f6f6f9; --surface-2:#ffffff; --surface-3:#ececf2; --surface-4:#e0e0e8;
  --hover:rgba(0,0,0,.05); --active:rgba(0,0,0,.09);
  --border:rgba(0,0,0,.09); --border-2:rgba(0,0,0,.16);
  --shadow:0 18px 50px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.1);
  --shadow-sm:0 4px 16px rgba(0,0,0,.12);
  --win-bg:#fbfbfd; --win-tb:#f1f1f5; --win-tb-inactive:#f6f6f9;
  --input:#ffffff; --scroll:rgba(0,0,0,.22);
  color-scheme:light;
}
.no-blur{ --glass:var(--surface-2); --glass-2:var(--surface-2); }
.no-blur *{ backdrop-filter:none!important; -webkit-backdrop-filter:none!important; }
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{ animation-duration:.001s!important; transition-duration:.001s!important; }
.high-contrast{ --border:rgba(255,255,255,.45); --border-2:rgba(255,255,255,.7); --text-2:#e6e6ee; --text-3:#c8c8d4; }
[data-theme=light].high-contrast{ --border:rgba(0,0,0,.5); --border-2:rgba(0,0,0,.75); --text-2:#222; --text-3:#333; }

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:#000; }
body{ font-family:var(--font); font-size:calc(13.5px * var(--scale)); color:var(--text); -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; touch-action:none; }
input,textarea,select,button{ font:inherit; color:inherit; }
textarea,input,[contenteditable]{ user-select:text; -webkit-user-select:text; }
::selection{ background:rgba(var(--accent-rgb),.45); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--scroll); border-radius:10px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover{ background-color:var(--text-3); }
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{ background:transparent; }
svg.i{ width:1.15em; height:1.15em; flex:none; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
.hidden{ display:none!important; }
.mono{ font-family:var(--mono); }
.muted{ color:var(--text-2); }
.dim{ color:var(--text-3); }
.grow{ flex:1; min-width:0; }
.row{ display:flex; align-items:center; gap:8px; }
.col{ display:flex; flex-direction:column; gap:8px; }
.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
kbd{ font-family:var(--mono); font-size:.85em; padding:1px 6px; border-radius:4px; background:var(--surface-3); border:1px solid var(--border-2); border-bottom-width:2px; }

/* ---------- controls ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:32px; padding:0 14px; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:var(--surface-3); color:var(--text); cursor:default; white-space:nowrap; transition:background var(--dur),border-color var(--dur),transform .08s; }
.btn:hover{ background:var(--surface-4); }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); border-color:transparent; color:#fff; }
.btn.primary:hover{ filter:brightness(1.1); }
.btn.danger{ background:var(--danger); border-color:transparent; color:#fff; }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.ghost:hover{ background:var(--hover); }
.btn.sm{ height:26px; padding:0 9px; font-size:.92em; }
.btn:disabled{ opacity:.45; pointer-events:none; }
.ibtn{ display:inline-grid; place-items:center; width:32px; height:32px; border-radius:var(--radius-sm); border:0; background:transparent; color:var(--text); flex:none; }
.ibtn:hover{ background:var(--hover); }
.ibtn:active{ background:var(--active); }
.ibtn:disabled{ opacity:.35; pointer-events:none; }
.ibtn.on{ background:rgba(var(--accent-rgb),.18); color:var(--accent); }
.input,select.input{ height:32px; padding:0 10px; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:var(--input); outline:none; min-width:0; transition:border-color var(--dur),box-shadow var(--dur); }
.input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22); }
textarea.input{ height:auto; padding:8px 10px; resize:vertical; }
.switch{ position:relative; width:40px; height:22px; flex:none; border-radius:20px; background:var(--surface-4); border:1px solid var(--border-2); transition:background var(--dur); cursor:default; }
.switch::after{ content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--text-2); transition:transform var(--dur) var(--ease),background var(--dur); }
.switch.on{ background:var(--accent); border-color:transparent; }
.switch.on::after{ transform:translateX(18px); background:#fff; }
input[type=range]{ -webkit-appearance:none; appearance:none; height:4px; border-radius:4px; background:var(--surface-4); outline:none; accent-color:var(--accent); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid var(--surface-2); box-shadow:0 0 0 1px var(--border-2); }
input[type=range]::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:var(--accent); border:3px solid var(--surface-2); }
.seg{ display:inline-flex; padding:2px; border-radius:var(--radius-sm); background:var(--surface-3); border:1px solid var(--border); }
.seg button{ border:0; background:transparent; height:26px; padding:0 12px; border-radius:5px; color:var(--text-2); }
.seg button.on{ background:var(--surface-2); color:var(--text); box-shadow:var(--shadow-sm); }
.chip{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:20px; font-size:.85em; background:var(--surface-3); border:1px solid var(--border); }
.card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); }
.spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(var(--accent-rgb),.25); border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.progress{ height:4px; border-radius:4px; background:var(--surface-4); overflow:hidden; }
.progress > i{ display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
.progress.indet > i{ width:35%!important; animation:indet 1.1s ease-in-out infinite; }
@keyframes indet{ from{ transform:translateX(-100%); } to{ transform:translateX(300%); } }

/* ---------- app icons ---------- */
.appicon{ --s:40px; width:var(--s); height:var(--s); flex:none; display:inline-grid; place-items:center; border-radius:calc(var(--s) * var(--icon-r)); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.25); position:relative; overflow:hidden; }
.appicon::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%); }
.appicon svg{ width:62%; height:62%; position:relative; stroke:#fff; color:#fff; fill:none; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
.appicon.dk svg{ stroke:#2a1626; color:#2a1626; filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)); }
.appicon{ outline:1px solid rgba(255,255,255,.08); outline-offset:-1px; }
.appicon.glogo{ background:linear-gradient(160deg,#ffffff,#eceaf0)!important; }
.appicon.glogo img{ width:74%; height:74%; object-fit:contain; border-radius:18%; }
.appicon.glogo.px img{ image-rendering:pixelated; }
.appicon.glogo .fb{ display:none; position:absolute; inset:0; place-items:center; }
.appicon.glogo.fail{ background:var(--fbg)!important; } .appicon.glogo.fail img{ display:none; } .appicon.glogo.fail .fb{ display:grid; }
.appicon img{ width:78%; height:78%; object-fit:contain; position:relative; image-rendering:auto; }
.appicon.raw{ background:none!important; box-shadow:none; }
.appicon.raw::before{ display:none; }
.appicon.raw img{ width:100%; height:100%; }
.fileicon{ --s:40px; width:var(--s); height:var(--s); flex:none; position:relative; display:inline-block; }
.fileicon svg{ width:100%; height:100%; }
.fileicon .lnk{ position:absolute; left:-2px; bottom:-2px; width:42%; height:42%; background:#fff; border-radius:4px; color:#1a73e8; display:grid; place-items:center; box-shadow:0 1px 3px rgba(0,0,0,.4); }
.fileicon .lnk svg{ width:80%; height:80%; stroke:#1a73e8; stroke-width:3; fill:none; }
.fileicon > .appicon{ --s:100%; width:100%; height:100%; }
.fileicon img.thumb{ width:100%; height:100%; object-fit:cover; border-radius:5px; box-shadow:0 1px 4px rgba(0,0,0,.35); background:#fff; }

/* =====================================================================
   Boot / OOBE / Lock
   ===================================================================== */
#boot{ position:fixed; inset:0; z-index:9000; background:#000; display:grid; place-items:center; color:#fff; transition:opacity .5s; }
#boot .logo{ display:flex; flex-direction:column; align-items:center; gap:46px; }
#boot .mark{ width:96px; height:96px; filter:drop-shadow(0 6px 24px rgba(var(--accent-rgb),.45)); }
#boot .dots{ width:34px; height:34px; position:relative; }
#boot .dots i{ position:absolute; inset:0; animation:bootdot 2.2s infinite cubic-bezier(.5,.1,.4,.9); }
#boot .dots i::after{ content:""; position:absolute; top:0; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:#fff; }
#boot .dots i:nth-child(2){ animation-delay:.12s } #boot .dots i:nth-child(3){ animation-delay:.24s } #boot .dots i:nth-child(4){ animation-delay:.36s } #boot .dots i:nth-child(5){ animation-delay:.48s }
@keyframes bootdot{ 0%{ transform:rotate(0); opacity:0 } 10%{ opacity:1 } 70%{ transform:rotate(360deg); opacity:1 } 80%,100%{ transform:rotate(360deg); opacity:0 } }
#boot .msg{ position:absolute; bottom:12%; left:0; right:0; text-align:center; color:#aaa; font-size:13px; letter-spacing:.3px; }
#boot .bios{ position:absolute; top:24px; left:28px; font-family:var(--mono); font-size:12px; color:#9a9a9a; white-space:pre; line-height:1.5; }

.fullscreen-layer{ position:fixed; inset:0; z-index:8000; }
.wall-bg{ position:absolute; inset:0; background-size:cover; background-position:center; }

#lock{ color:#fff; overflow:hidden; }
#lock .wall-bg{ transition:filter .45s var(--ease),transform .45s var(--ease); }
#lock.auth .wall-bg{ filter:blur(28px) brightness(.62); transform:scale(1.08); }
#lock .clock{ position:absolute; left:0; right:0; top:13%; text-align:center; transition:transform .45s var(--ease),opacity .35s; text-shadow:0 2px 20px rgba(0,0,0,.35); }
#lock .clock .t{ font-size:min(19vw,112px); font-weight:600; letter-spacing:-2px; line-height:1; }
#lock .clock .d{ font-size:21px; margin-top:12px; font-weight:500; opacity:.95; }
#lock.lc-left .clock{ text-align:left; left:7vw; top:auto; bottom:14%; }
#lock.lc-minimal .clock .t{ font-weight:200; font-size:min(14vw,84px); letter-spacing:4px; }
#lock.lc-minimal .clock .d{ font-size:15px; letter-spacing:3px; text-transform:uppercase; opacity:.8; }
#lock.lc-hidden .clock{ display:none; }
#lock.auth .clock{ transform:translateY(-60px); opacity:0; pointer-events:none; }
#lock .hint{ position:absolute; bottom:44px; left:0; right:0; text-align:center; font-size:13px; opacity:.8; animation:float 2.4s ease-in-out infinite; }
#lock.auth .hint{ opacity:0; }
@keyframes float{ 50%{ transform:translateY(-5px); } }
#lock .login{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; opacity:0; transform:translateY(30px) scale(.98); pointer-events:none; transition:all .4s var(--ease); }
#lock.auth .login{ opacity:1; transform:none; pointer-events:auto; }
.avatar{ border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:600; flex:none; background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); overflow:hidden; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
#lock .login .avatar{ width:150px; height:150px; font-size:58px; box-shadow:0 8px 40px rgba(0,0,0,.35); }
#lock .login .name{ font-size:27px; font-weight:600; }
#lock .login .pw{ display:flex; width:290px; margin-top:6px; }
#lock .login .pw input{ flex:1; height:38px; border-radius:6px 0 0 6px; border:1px solid rgba(255,255,255,.3); border-bottom:2px solid var(--accent); background:rgba(0,0,0,.35); color:#fff; padding:0 12px; outline:none; }
#lock .login .pw input::placeholder{ color:rgba(255,255,255,.6); }
#lock .login .pw button{ width:42px; border:1px solid rgba(255,255,255,.3); border-left:0; border-radius:0 6px 6px 0; background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; }
#lock .login .pw button:hover{ background:rgba(255,255,255,.24); }
#lock .login .err{ min-height:18px; font-size:13px; color:#ffd0d5; }
#lock .login .signin{ height:38px; padding:0 34px; border-radius:6px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.16); color:#fff; font-size:14px; }
#lock .login .signin:hover{ background:rgba(255,255,255,.26); }
#lock .corner{ position:absolute; right:26px; bottom:22px; display:flex; gap:6px; }
#lock .corner button{ width:40px; height:40px; border:0; border-radius:8px; background:transparent; color:#fff; display:grid; place-items:center; }
#lock .corner button:hover{ background:rgba(255,255,255,.15); }
#lock .status{ position:absolute; right:26px; bottom:26px; display:flex; gap:14px; opacity:.9; }
#lock.auth .status{ display:none; }
.shake{ animation:shake .4s; }
@keyframes shake{ 20%,60%{ transform:translateX(-8px) } 40%,80%{ transform:translateX(8px) } }

#oobe{ display:grid; place-items:center; color:var(--text); }
#oobe .wall-bg{ filter:blur(calc(var(--blur) + 10px)) brightness(.7); transform:scale(1.15); }
#oobe .panel{ position:relative; width:min(760px,94vw); min-height:min(480px,90vh); display:grid; grid-template-columns:1fr 1.25fr; border-radius:16px; overflow:hidden; background:var(--glass-2); backdrop-filter:blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter:blur(var(--blur)) saturate(1.4); box-shadow:var(--shadow); border:1px solid var(--border); }
#oobe .side{ padding:40px 34px; background:linear-gradient(160deg,rgba(var(--accent-rgb),.35),rgba(139,92,246,.25)); display:flex; flex-direction:column; justify-content:space-between; }
#oobe .side h1{ font-size:30px; margin:18px 0 8px; font-weight:650; }
#oobe .side p{ color:var(--text-2); line-height:1.55; margin:0; }
#oobe .steps{ display:flex; gap:6px; }
#oobe .steps i{ width:26px; height:4px; border-radius:4px; background:var(--border-2); transition:background .3s; }
#oobe .steps i.on{ background:var(--accent); }
#oobe .main{ padding:40px 36px; display:flex; flex-direction:column; gap:14px; }
#oobe .main h2{ margin:0; font-size:22px; font-weight:600; }
#oobe .main .foot{ margin-top:auto; display:flex; justify-content:flex-end; gap:8px; }
#oobe label{ font-size:12.5px; color:var(--text-2); display:block; margin-bottom:5px; }
.swatches{ display:flex; flex-wrap:wrap; gap:8px; }
.swatches button{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; outline:2px solid transparent; outline-offset:1px; }
.swatches button.on{ outline-color:var(--text); }
.themepick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.themepick button{ border:2px solid var(--border); border-radius:10px; padding:8px; background:var(--surface-3); text-align:left; }
.themepick button.on{ border-color:var(--accent); }
.themepick .pv{ height:64px; border-radius:6px; margin-bottom:6px; position:relative; overflow:hidden; }
.themepick .pv::after{ content:""; position:absolute; left:10px; right:24px; bottom:0; height:38px; border-radius:6px 6px 0 0; }
.themepick .pv.d{ background:linear-gradient(135deg,#283a63,#40285e); } .themepick .pv.d::after{ background:#202026; }
.themepick .pv.l{ background:linear-gradient(135deg,#a6c8ff,#d9c4ff); } .themepick .pv.l::after{ background:#fbfbfd; }

/* =====================================================================
   Desktop
   ===================================================================== */
#desktop{ position:fixed; inset:0; overflow:hidden; }
#wallpaper{ position:absolute; inset:0; background-size:cover; background-position:center; transition:background .6s; }
#icons{ position:absolute; inset:0 0 var(--tb-space) 0; }
.dicon{ --s:calc(50px * var(--icon-scale,1)); position:absolute; width:calc(var(--s) + 42px); padding:6px 3px 5px; border-radius:6px; display:flex; flex-direction:column; align-items:center; gap:5px; color:#fff; text-align:center; border:1px solid transparent; }
.dicon .lbl{ font-size:12.5px; line-height:1.25; text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.4); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; max-width:100%; }
.dicon:hover{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.12); }
.dicon.sel{ background:rgba(var(--accent-rgb),.32); border-color:rgba(var(--accent-rgb),.6); }
.dicon.sel .lbl{ -webkit-line-clamp:unset; }
.dicon.cut{ opacity:.5; }
.dicon.droptarget{ background:rgba(var(--accent-rgb),.45); }
.dicon.dragging{ opacity:.75; z-index:5; pointer-events:none; }
.dicon .appicon,.dicon .fileicon{ --s:calc(50px * var(--icon-scale,1)); }
.rename-input{ width:100%; font-size:12.5px; text-align:center; border:1px solid var(--accent); background:var(--input); color:var(--text); border-radius:3px; padding:1px 3px; outline:none; resize:none; font-family:inherit; }
#selrect{ position:absolute; border:1px solid rgba(var(--accent-rgb),.9); background:rgba(var(--accent-rgb),.2); z-index:3; pointer-events:none; display:none; }
#windows{ position:absolute; inset:0 0 var(--tb-space) 0; pointer-events:none; }
#windows > *{ pointer-events:auto; }
#snap-preview{ position:absolute; z-index:1; pointer-events:none; border-radius:12px; background:rgba(var(--accent-rgb),.16); border:1px solid rgba(var(--accent-rgb),.5); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transition:all .18s var(--ease); }
#snap-preview.on{ opacity:1; }
#nightlight{ position:fixed; inset:0; z-index:9500; pointer-events:none; background:rgba(255,140,40,.0); mix-blend-mode:multiply; transition:background .6s; }
#dimmer{ position:fixed; inset:0; z-index:9499; pointer-events:none; background:#000; opacity:0; transition:opacity .3s; }

/* =====================================================================
   Windows
   ===================================================================== */
.win{ position:absolute; display:flex; flex-direction:column; min-width:280px; min-height:160px; background:var(--win-bg); border-radius:var(--radius); border:1px solid var(--border-2); box-shadow:var(--win-shadow,var(--shadow)); overflow:visible; transition:box-shadow .2s; }
.win.inactive{ box-shadow:0 8px 28px rgba(0,0,0,.28); }
.win > .frame{ position:absolute; inset:0; border-radius:inherit; overflow:hidden; display:flex; flex-direction:column; }
.win.max{ border-radius:0; border-color:transparent; }
.win.snapped{ border-radius:0; }
.win.anim{ transition:left .22s var(--ease),top .22s var(--ease),width .22s var(--ease),height .22s var(--ease),transform .22s var(--ease),opacity .22s,border-radius .22s; }
.win.opening{ animation:winIn calc(.22s * var(--spd)) var(--ease); }
@keyframes winIn{ from{ opacity:0; transform:scale(.94) translateY(8px); } }
.win.closing{ animation:winOut calc(.16s * var(--spd)) ease-in forwards; pointer-events:none; }
@keyframes winOut{ to{ opacity:0; transform:scale(.94); } }
.win.minimized{ opacity:0; pointer-events:none; transform:translateY(40%) scale(.6); }
.win .tbar{ height:38px; flex:none; display:flex; align-items:center; background:var(--win-tb); gap:4px; padding-left:10px; position:relative; }
.win.inactive .tbar{ background:var(--win-tb-inactive); }
.win.inactive .tbar .ttl,.win.inactive .tbar .tico{ opacity:.55; }
.win .tbar .tico{ display:flex; }
.win .tbar .tico .appicon,.win .tbar .tico .fileicon{ --s:20px; }
.win .tbar .ttl{ flex:1; min-width:0; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:4px; }
.win .tbar .tctl{ display:flex; height:100%; align-self:flex-start; }
.win .tbar .tctl button{ width:46px; height:100%; border:0; background:transparent; color:var(--text); display:grid; place-items:center; }
.win .tbar .tctl button:hover{ background:var(--hover); }
.win .tbar .tctl button.x:hover{ background:#e81123; color:#fff; }
.win .tbar .tctl svg{ width:14px; height:14px; stroke-width:1.5; }
.win .tbar .extra{ display:flex; align-items:center; gap:2px; }
.win .wbody{ flex:1; min-height:0; position:relative; display:flex; flex-direction:column; overflow:hidden; }
.win .rz{ position:absolute; z-index:3; }
.win .rz.n{ top:-4px; left:8px; right:8px; height:8px; cursor:ns-resize; }
.win .rz.s{ bottom:-4px; left:8px; right:8px; height:8px; cursor:ns-resize; }
.win .rz.e{ right:-4px; top:8px; bottom:8px; width:8px; cursor:ew-resize; }
.win .rz.w{ left:-4px; top:8px; bottom:8px; width:8px; cursor:ew-resize; }
.win .rz.ne{ right:-5px; top:-5px; width:14px; height:14px; cursor:nesw-resize; }
.win .rz.nw{ left:-5px; top:-5px; width:14px; height:14px; cursor:nwse-resize; }
.win .rz.se{ right:-5px; bottom:-5px; width:14px; height:14px; cursor:nwse-resize; }
.win .rz.sw{ left:-5px; bottom:-5px; width:14px; height:14px; cursor:nesw-resize; }
.win.max .rz{ display:none; }
body.wm-drag iframe,body.wm-drag webview,body.wm-drag canvas{ pointer-events:none; }
body.wm-drag{ cursor:default; }
body.wm-drag.rz-ns{ cursor:ns-resize; } body.wm-drag.rz-ew{ cursor:ew-resize; } body.wm-drag.rz-nesw{ cursor:nesw-resize; } body.wm-drag.rz-nwse{ cursor:nwse-resize; }
.win .modal-cover{ position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.25); display:grid; place-items:center; }

/* window-internal chrome */
.toolbar{ display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--border); background:var(--win-bg); flex:none; }
.toolbar .sep{ width:1px; height:20px; background:var(--border-2); margin:0 4px; }
.statusbar{ display:flex; align-items:center; gap:16px; height:26px; padding:0 12px; font-size:12px; color:var(--text-2); border-top:1px solid var(--border); flex:none; background:var(--win-bg); }
.menubar{ display:flex; height:30px; align-items:center; padding:0 4px; flex:none; border-bottom:1px solid var(--border); background:var(--win-bg); }
.menubar > button{ border:0; background:transparent; height:24px; padding:0 10px; border-radius:5px; font-size:12.8px; }
.menubar > button:hover,.menubar > button.open{ background:var(--hover); }
.empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-3); height:100%; text-align:center; padding:20px; }
.empty-state svg.i{ width:48px; height:48px; stroke-width:1.2; }
.sidebar{ width:200px; flex:none; overflow:auto; padding:8px 6px; border-right:1px solid var(--border); background:var(--surface); }
.navitem{ display:flex; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:6px; color:var(--text); white-space:nowrap; overflow:hidden; position:relative; }
.navitem:hover{ background:var(--hover); }
.navitem.on{ background:var(--active); }
.navitem.on::before{ content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--accent); }
.navitem .appicon,.navitem .fileicon{ --s:18px; }
.navhead{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); padding:12px 10px 4px; font-weight:600; }

/* =====================================================================
   Taskbar
   ===================================================================== */
#taskbar{ position:fixed; left:0; right:0; bottom:0; height:var(--tb-h); z-index:5000; display:flex; align-items:center; padding:0 6px; background:var(--glass); backdrop-filter:blur(var(--blur)) saturate(1.6); -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6); border-top:1px solid var(--border); }
#taskbar .tb-center{ position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:3px; height:100%; transition:left .3s var(--ease),transform .3s var(--ease); max-width:calc(100% - 420px); }
#taskbar.left .tb-center{ left:6px; transform:none; }
.tb-btn{ position:relative; height:40px; min-width:40px; padding:0 8px; border-radius:6px; border:0; background:transparent; display:grid; place-items:center; color:var(--text); transition:background .15s; flex:none; }
.tb-btn:hover{ background:var(--hover); }
.tb-btn:active .appicon,.tb-btn:active > svg{ transform:scale(.86); }
.tb-btn .appicon{ --s:26px; transition:transform .15s; }
.tb-btn .fileicon{ --s:26px; }
.tb-btn > svg.i{ width:22px; height:22px; transition:transform .15s; }
.tb-btn.running::after{ content:""; position:absolute; bottom:2px; left:50%; width:6px; height:3px; margin-left:-3px; border-radius:3px; background:var(--text-3); transition:width .2s,margin .2s,background .2s; }
.tb-btn.active{ background:var(--hover); }
.tb-btn.active::after{ width:16px; margin-left:-8px; background:var(--accent); }
.tb-btn.attn{ animation:attn 1s 3; }
@keyframes attn{ 50%{ background:rgba(255,170,0,.35); } }
.tb-btn .badge{ position:absolute; top:3px; right:3px; min-width:15px; height:15px; border-radius:8px; background:var(--accent); color:#fff; font-size:9.5px; display:grid; place-items:center; padding:0 3px; }
#start-btn .startlogo{ width:calc(var(--tb-h) * .56); height:calc(var(--tb-h) * .56); filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
.tb-search{ display:flex; align-items:center; gap:8px; height:34px; width:190px; padding:0 12px; border-radius:20px; background:var(--hover); border:1px solid var(--border); color:var(--text-2); margin:0 4px; flex:none; }
.tb-search:hover{ background:var(--active); }
#taskbar .tb-right{ margin-left:auto; display:flex; align-items:center; gap:2px; height:100%; }
.tray-btn{ height:40px; padding:0 8px; border:0; border-radius:6px; background:transparent; display:flex; align-items:center; gap:7px; color:var(--text); }
.tray-btn:hover{ background:var(--hover); }
.tray-btn svg.i{ width:17px; height:17px; }
.tb-clock{ display:flex; flex-direction:column; align-items:flex-end; font-size:12px; line-height:1.35; }
#show-desktop{ width:8px; height:100%; border:0; border-left:1px solid var(--border-2); background:transparent; margin-left:6px; }
#show-desktop:hover{ background:var(--hover); }
.tb-preview{ position:fixed; z-index:5200; bottom:calc(var(--tb-space) + 8px); background:var(--glass-2); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:6px; display:flex; gap:6px; animation:popIn .14s var(--ease); }
.tb-preview .pv{ width:200px; border-radius:7px; padding:6px; }
.tb-preview .pv:hover{ background:var(--hover); }
.tb-preview .pv .h{ display:flex; align-items:center; gap:7px; font-size:12px; margin-bottom:6px; }
.tb-preview .pv .h .appicon{ --s:16px; }
.tb-preview .pv .h .x{ margin-left:auto; width:22px; height:22px; border:0; border-radius:4px; background:transparent; color:var(--text); display:grid; place-items:center; opacity:0; }
.tb-preview .pv:hover .h .x{ opacity:1; }
.tb-preview .pv .h .x:hover{ background:#e81123; color:#fff; }
.tb-preview .pv .thumb{ height:112px; border-radius:5px; background:var(--surface-3); overflow:hidden; display:grid; place-items:center; position:relative; }
.tb-preview .pv .thumb .appicon{ --s:44px; }
.tooltip{ position:fixed; z-index:9800; pointer-events:none; background:var(--surface-2); color:var(--text); border:1px solid var(--border-2); padding:5px 9px; border-radius:6px; font-size:12px; box-shadow:var(--shadow-sm); white-space:nowrap; animation:popIn .12s; }

/* =====================================================================
   Flyouts (start, calendar, quick settings)
   ===================================================================== */
.flyout{ position:fixed; z-index:5100; bottom:calc(var(--tb-space) + 10px); background:var(--glass-2); backdrop-filter:blur(calc(var(--blur) + 10px)) saturate(1.6); -webkit-backdrop-filter:blur(calc(var(--blur) + 10px)) saturate(1.6); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .18s,transform .22s var(--ease); }
.flyout.open{ opacity:1; transform:none; pointer-events:auto; }
#startmenu{ left:50%; margin-left:-320px; width:640px; height:min(680px,calc(100vh - var(--tb-space) - 24px)); display:flex; flex-direction:column; overflow:hidden; }
#taskbar.left ~ #startmenu{ left:10px; margin-left:0; }
#startmenu .sm-search{ padding:22px 28px 6px; }
#startmenu .sm-search .box{ display:flex; align-items:center; gap:10px; height:38px; padding:0 14px; border-radius:20px; background:var(--input); border:1px solid var(--border-2); border-bottom:2px solid var(--accent); }
#startmenu .sm-search input{ flex:1; border:0; background:transparent; outline:none; height:100%; }
#startmenu .sm-body{ flex:1; overflow:auto; padding:10px 28px; position:relative; }
#startmenu .sec-h{ display:flex; align-items:center; justify-content:space-between; margin:12px 6px 10px; font-weight:600; font-size:13.5px; }
.sm-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }
.sm-app{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px 10px; border-radius:8px; border:0; background:transparent; text-align:center; font-size:12px; color:var(--text); }
.sm-app:hover{ background:var(--hover); }
.sm-app .appicon{ --s:42px; }
.sm-app span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sm-rec{ display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.sm-rec .it{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:8px; min-width:0; }
.sm-rec .it:hover{ background:var(--hover); }
.sm-rec .it .fileicon,.sm-rec .it .appicon{ --s:32px; }
.sm-rec .it .t{ font-size:12.8px; } .sm-rec .it .s{ font-size:11.5px; color:var(--text-3); }
.sm-all .letter{ font-size:12px; color:var(--accent); font-weight:600; padding:10px 10px 4px; }
.sm-all .it{ display:flex; align-items:center; gap:12px; height:40px; padding:0 10px; border-radius:7px; }
.sm-all .it:hover{ background:var(--hover); }
.sm-all .it .appicon{ --s:26px; }
#startmenu .sm-foot{ height:62px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 40px; background:var(--hover); border-top:1px solid var(--border); }
.sm-user{ display:flex; align-items:center; gap:12px; padding:6px 12px; border-radius:8px; border:0; background:transparent; }
.sm-user:hover{ background:var(--hover); }
.sm-user .avatar{ width:32px; height:32px; font-size:14px; }
.search-results .sr{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:8px; }
.search-results .sr.on,.search-results .sr:hover{ background:var(--active); }
.search-results .sr .appicon,.search-results .sr .fileicon{ --s:30px; }
.search-results .sr .s{ font-size:11.5px; color:var(--text-3); }
.search-results .best{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:24px; border-radius:10px; background:var(--hover); text-align:center; }
.search-results .best .appicon,.search-results .best .fileicon{ --s:64px; }

#calendar-fly{ right:10px; width:340px; overflow:hidden; display:flex; flex-direction:column; max-height:calc(100vh - var(--tb-space) - 24px); }
.notif-center{ max-height:330px; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.notif-center .hd{ display:flex; justify-content:space-between; align-items:center; font-weight:600; padding:0 4px 4px; }
.cal{ padding:14px 16px 16px; border-top:1px solid var(--border); }
.cal .hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal .today{ font-weight:600; font-size:14px; }
.cal .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
.cal .grid .dw{ font-size:11.5px; color:var(--text-3); height:28px; line-height:28px; }
.cal .grid .d{ height:38px; display:grid; place-items:center; border-radius:50%; font-size:13px; }
.cal .grid .d:hover{ background:var(--hover); }
.cal .grid .d.o{ color:var(--text-3); }
.cal .grid .d.t{ background:var(--accent); color:#fff; font-weight:600; }
#quick-fly{ right:10px; width:360px; padding:18px; }
.qs-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.qs-tile{ display:flex; flex-direction:column; gap:6px; }
.qs-tile button{ height:48px; border-radius:8px; border:1px solid var(--border-2); background:var(--surface-3); display:grid; place-items:center; color:var(--text); }
.qs-tile button:hover{ filter:brightness(1.12); }
.qs-tile button.on{ background:var(--accent); border-color:transparent; color:#fff; }
.qs-tile span{ font-size:11.5px; text-align:center; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qs-slider{ display:flex; align-items:center; gap:12px; margin-top:16px; }
.qs-slider input{ flex:1; }
.qs-foot{ display:flex; align-items:center; justify-content:space-between; margin:16px -18px -18px; padding:10px 18px; background:var(--hover); border-top:1px solid var(--border); border-radius:0 0 var(--radius-lg) var(--radius-lg); font-size:12.5px; }

/* =====================================================================
   Notifications / toasts
   ===================================================================== */
#toasts{ position:fixed; right:12px; bottom:calc(var(--tb-space) + 12px); z-index:9100; display:flex; flex-direction:column-reverse; gap:10px; width:360px; pointer-events:none; }
.toast{ pointer-events:auto; display:flex; gap:12px; padding:14px; border-radius:12px; background:var(--glass-2); backdrop-filter:blur(var(--blur)) saturate(1.5); -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5); border:1px solid var(--border); box-shadow:var(--shadow); animation:toastIn .3s var(--ease); position:relative; }
.toast.out{ animation:toastOut .25s ease-in forwards; }
@keyframes toastIn{ from{ opacity:0; transform:translateX(60px); } }
@keyframes toastOut{ to{ opacity:0; transform:translateX(60px); } }
.toast .appicon{ --s:30px; }
.toast .t{ font-weight:600; font-size:13.3px; margin-bottom:2px; }
.toast .b{ font-size:12.6px; color:var(--text-2); line-height:1.4; word-break:break-word; }
.toast .x{ position:absolute; top:6px; right:6px; width:24px; height:24px; border:0; border-radius:5px; background:transparent; color:var(--text-2); display:grid; place-items:center; opacity:0; }
.toast:hover .x{ opacity:1; }
.toast .x:hover{ background:var(--hover); }
.toast .acts{ display:flex; gap:6px; margin-top:10px; }
.notif-item{ display:flex; gap:10px; padding:12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); position:relative; }
.notif-item .appicon{ --s:24px; }
.notif-item .t{ font-weight:600; font-size:12.8px; } .notif-item .b{ font-size:12.3px; color:var(--text-2); }
.notif-item .tm{ font-size:11px; color:var(--text-3); margin-left:auto; flex:none; }

/* =====================================================================
   Context menus / dialogs
   ===================================================================== */
.ctx{ position:fixed; z-index:9600; min-width:220px; max-width:320px; padding:5px; border-radius:10px; background:var(--glass-2); backdrop-filter:blur(var(--blur)) saturate(1.5); -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5); border:1px solid var(--border); box-shadow:var(--shadow); animation:popIn .12s var(--ease); font-size:13px; }
@keyframes popIn{ from{ opacity:0; transform:scale(.96) translateY(-4px); } }
.ctx .mi{ display:flex; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:6px; white-space:nowrap; position:relative; }
.ctx .mi:hover,.ctx .mi.hl{ background:var(--hover); }
.ctx .mi.dis{ opacity:.4; pointer-events:none; }
.ctx .mi .ic{ width:18px; display:grid; place-items:center; color:var(--text-2); }
.ctx .mi .ic .appicon{ --s:16px; }
.ctx .mi .lb{ flex:1; }
.ctx .mi .kb{ color:var(--text-3); font-size:11.5px; margin-left:24px; }
.ctx .mi .ar{ color:var(--text-3); }
.ctx .mi.danger{ color:var(--danger); } .ctx .mi.danger .ic{ color:var(--danger); }
.ctx .sep{ height:1px; background:var(--border-2); margin:4px 6px; }
.ctx .mi .chk{ color:var(--accent); }
#modal-layer{ position:fixed; inset:0; z-index:9300; pointer-events:none; }
#modal-layer > .backdrop{ position:absolute; inset:0; pointer-events:auto; background:rgba(0,0,0,.32); display:grid; place-items:center; animation:fadeIn .15s; }
@keyframes fadeIn{ from{ opacity:0; } }
.dialog{ width:min(440px,92vw); background:var(--win-bg); border:1px solid var(--border-2); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; animation:dlgIn .2s var(--ease); }
@keyframes dlgIn{ from{ opacity:0; transform:scale(1.06); } }
.dialog .dbody{ padding:22px 24px 18px; display:flex; gap:16px; }
.dialog .dbody .dic{ flex:none; }
.dialog .dbody .dic svg.i{ width:34px; height:34px; }
.dialog .dbody h3{ margin:0 0 8px; font-size:17px; font-weight:600; }
.dialog .dbody p{ margin:0; color:var(--text-2); line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.dialog .dfoot{ padding:14px 24px; display:flex; justify-content:flex-end; gap:8px; background:var(--surface); border-top:1px solid var(--border); }
.dialog.wide{ width:min(720px,94vw); }

/* Run dialog / switcher / task view */
#switcher{ position:fixed; inset:0; z-index:9200; display:grid; place-items:center; pointer-events:none; }
#switcher .box{ display:flex; gap:10px; padding:14px; border-radius:14px; background:var(--glass-2); backdrop-filter:blur(calc(var(--blur) + 10px)); -webkit-backdrop-filter:blur(calc(var(--blur) + 10px)); border:1px solid var(--border); box-shadow:var(--shadow); max-width:90vw; overflow:hidden; }
#switcher .it{ width:150px; padding:10px; border-radius:10px; border:2px solid transparent; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; }
#switcher .it.on{ border-color:var(--accent); background:var(--hover); }
#switcher .it .appicon{ --s:48px; }
#switcher .it span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#taskview{ position:absolute; inset:0 0 var(--tb-space) 0; z-index:99; background:rgba(0,0,0,.35); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); opacity:0; pointer-events:none; transition:opacity .2s; }
#taskview.open{ opacity:1; pointer-events:auto; }
#taskview .tv-empty{ position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:16px; opacity:.85; }
#taskview .tv-label{ position:absolute; display:flex; align-items:center; gap:8px; color:#fff; font-size:12.5px; text-shadow:0 1px 4px #000; pointer-events:none; }
#taskview .tv-label .appicon{ --s:18px; }
#taskview .tv-label .x{ pointer-events:auto; margin-left:auto; width:24px; height:24px; border:0; border-radius:5px; background:rgba(0,0,0,.4); color:#fff; display:grid; place-items:center; }
#taskview .tv-label .x:hover{ background:#e81123; }
body.taskview-on .win{ transition:transform .28s var(--ease),opacity .2s; cursor:pointer; }
body.taskview-on .win > .frame{ pointer-events:none; }
body.taskview-on .win:hover{ outline:3px solid var(--accent); outline-offset:4px; }

/* =====================================================================
   App-specific styles
   ===================================================================== */
/* ---- Explorer ---- */
.fx{ display:flex; flex-direction:column; height:100%; }

.fx .addr .crumb:hover{ background:var(--hover); }

.fx .main{ flex:1; display:flex; min-height:0; }

.fx .fi:hover{ background:var(--hover); }

.fx .fi.cut{ opacity:.5; }

.fx .list .fi{ display:grid; grid-template-columns:minmax(180px,1fr) 150px 120px 90px; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:5px; border:1px solid transparent; }
.fx .list .fi .nmc{ display:flex; align-items:center; gap:10px; min-width:0; }
.fx .list .fi .fileicon,.fx .list .fi .appicon{ --s:20px; }
.fx .list .fi > span{ color:var(--text-2); font-size:12.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fx .list .lh{ display:grid; grid-template-columns:minmax(180px,1fr) 150px 120px 90px; gap:10px; padding:0 10px 6px; font-size:12px; color:var(--text-3); border-bottom:1px solid var(--border); margin-bottom:4px; position:sticky; top:-8px; background:var(--win-bg); padding-top:6px; z-index:1; }

.fx .preview-pane{ width:260px; border-left:1px solid var(--border); padding:16px; overflow:auto; flex:none; display:flex; flex-direction:column; gap:10px; }

.fx .preview-pane .big img{ max-width:100%; max-height:200px; border-radius:6px; }
.fx .preview-pane dl{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:12.3px; margin:0; }
.fx .preview-pane dt{ color:var(--text-3); } .fx .preview-pane dd{ margin:0; word-break:break-all; }
.drives{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; padding:6px; }
.drive{ display:flex; gap:14px; align-items:center; padding:12px; border-radius:8px; border:1px solid transparent; }
.drive:hover{ background:var(--hover); }
.drive svg.i{ width:42px; height:42px; stroke-width:1.3; color:var(--accent); }

/* ---- Browser ---- */
.br{ display:flex; flex-direction:column; height:100%; background:var(--surface); }
.br-tabs{ display:flex; align-items:flex-end; gap:2px; height:38px; padding:0 0 0 2px; min-width:0; flex:0 1 auto; overflow:hidden; }

.br-tab .x{ width:20px; height:20px; border:0; border-radius:4px; background:transparent; color:var(--text-2); display:grid; place-items:center; flex:none; }

.br-bar{ display:flex; align-items:center; gap:4px; padding:6px 8px; background:var(--surface-2); }

.br-omni .mode{ font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(var(--accent-rgb),.18); color:var(--accent); white-space:nowrap; }
.br-bm{ display:flex; align-items:center; gap:2px; padding:0 8px 5px; background:var(--surface-2); border-bottom:1px solid var(--border); min-height:6px; overflow:hidden; }
.br-bm .b{ display:flex; align-items:center; gap:6px; height:26px; padding:0 9px; border-radius:13px; font-size:12px; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
.br-bm .b:hover{ background:var(--hover); }
.br-bm .b img{ width:14px; height:14px; border-radius:2px; }
.br-view{ flex:1; position:relative; background:#fff; min-height:0; }
.br-view iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
.br-view .internal{ position:absolute; inset:0; overflow:auto; background:var(--surface); color:var(--text); }
.br-load{ position:absolute; top:0; left:0; right:0; height:2px; z-index:3; overflow:hidden; }

.br-err{ position:absolute; inset:0; background:var(--surface); display:flex; align-items:center; justify-content:center; padding:30px; }

.ntp{ min-height:100%; display:flex; flex-direction:column; align-items:center; padding:9vh 20px 40px; background:radial-gradient(1200px 500px at 50% -10%,rgba(var(--accent-rgb),.25),transparent),var(--surface); }
.ntp .logo{ font-size:46px; font-weight:700; letter-spacing:-1.5px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ntp .sb{ width:min(580px,92%); height:48px; margin:22px 0 34px; display:flex; align-items:center; gap:10px; padding:0 18px; border-radius:24px; background:var(--surface-2); border:1px solid var(--border-2); box-shadow:var(--shadow-sm); }

.ntp .tiles{ display:grid; grid-template-columns:repeat(auto-fill,96px); gap:10px; justify-content:center; width:min(640px,100%); }

.intpage .li{ display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:7px; }
.intpage .li:hover{ background:var(--hover); }
.intpage .li img{ width:16px; height:16px; }

/* ---- Settings ---- */
.st{ display:flex; height:100%; }

.st .sfind{ display:flex; align-items:center; gap:8px; height:32px; padding:0 10px; margin:0 4px 10px; border-radius:6px; background:var(--input); border:1px solid var(--border-2); border-bottom-color:var(--accent); }
.st .sfind input{ flex:1; border:0; outline:none; background:transparent; min-width:0; }

.wp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }

.wp-grid button.on{ border-color:var(--accent); }
.wp-grid button:hover{ filter:brightness(1.1); }
.st-hero{ display:flex; gap:20px; align-items:center; padding:18px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:16px; }
.st-hero .mon{ width:200px; aspect-ratio:16/10; border-radius:8px; border:6px solid #111; background-size:cover; background-position:center; box-shadow:var(--shadow-sm); flex:none; position:relative; }
.st-hero .mon::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:10%; background:var(--glass); }
.st-hero .mon.has-win::before{ content:""; position:absolute; left:20%; top:18%; width:55%; height:52%; border-radius:4px; background:var(--win-bg); box-shadow:0 2px 6px rgba(0,0,0,.35); }
.meter{ height:8px; border-radius:6px; background:var(--surface-4); overflow:hidden; }
.meter i{ display:block; height:100%; background:var(--accent); }

/* ---- Terminal ---- */
.term{ flex:1; background:#0c0c10; color:#d8dee9; font-family:var(--mono); font-size:13.5px; line-height:1.45; padding:10px 12px; overflow:auto; outline:none; cursor:text; user-select:text; -webkit-user-select:text; white-space:pre-wrap; word-break:break-all; }
[data-theme=light] .term.follow{ background:#fafafa; color:#2a2a32; }
.term .ln{ min-height:1.45em; }
.term .inp{ display:inline; }
.term .cur{ display:inline-block; width:.6em; height:1.15em; background:#d8dee9; vertical-align:text-bottom; animation:blink 1.06s steps(1) infinite; margin-left:0; }
.term:not(:focus) .cur{ background:transparent; outline:1px solid #888; animation:none; }
@keyframes blink{ 50%{ opacity:0; } }
.term .c-g{ color:#7ee787; } .term .c-b{ color:#79c0ff; } .term .c-r{ color:#ff7b72; } .term .c-y{ color:#e3b341; } .term .c-m{ color:#d2a8ff; } .term .c-c{ color:#56d4dd; } .term .c-d{ color:#8b949e; } .term .c-w{ color:#fff; font-weight:600; }
.term-tabs{ display:flex; align-items:flex-end; height:100%; gap:2px; }
.term-tabs .tt{ display:flex; align-items:center; gap:6px; height:30px; padding:0 6px 0 12px; border-radius:7px 7px 0 0; font-size:12px; color:var(--text-2); max-width:180px; }
.term-tabs .tt.on{ background:#0c0c10; color:#eee; }

.term-tabs .tt .x:hover{ background:rgba(255,255,255,.12); }
.term-tabs .tt .x svg{ width:11px; height:11px; }

/* ---- Notepad ---- */
.np{ display:flex; flex-direction:column; height:100%; }
.np .edwrap{ flex:1; display:flex; min-height:0; background:var(--surface-2); }
.np .gutter{ padding:10px 8px 10px 12px; text-align:right; color:var(--text-3); font-family:var(--mono); font-size:13.5px; line-height:1.5; overflow:hidden; white-space:pre; border-right:1px solid var(--border); flex:none; user-select:none; }
.np textarea{ flex:1; border:0; outline:none; resize:none; padding:10px 14px; background:transparent; font-family:var(--mono); font-size:13.5px; line-height:1.5; tab-size:4; white-space:pre; overflow:auto; }
.np textarea.wrap{ white-space:pre-wrap; }
.np .md{ flex:1; overflow:auto; padding:18px 26px; border-left:1px solid var(--border); line-height:1.6; user-select:text; }
.np .md pre{ background:var(--surface-3); padding:10px; border-radius:6px; overflow:auto; }
.np .md code{ font-family:var(--mono); background:var(--surface-3); padding:1px 4px; border-radius:4px; }
.np .findbar{ display:flex; gap:6px; padding:6px 8px; border-bottom:1px solid var(--border); align-items:center; }

/* ---- Calculator ---- */
.calc{ display:flex; flex-direction:column; height:100%; padding:6px; gap:4px; background:var(--surface); }
.calc .disp{ padding:10px 14px 6px; text-align:right; }
.calc .disp .ex{ color:var(--text-3); min-height:20px; font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.calc .disp .v{ font-size:44px; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.calc .keys{ flex:1; display:grid; gap:3px; }
.calc .keys button{ border:0; border-radius:6px; background:var(--surface-2); font-size:16px; border:1px solid var(--border); min-height:38px; }
.calc .keys button:hover{ background:var(--surface-3); }
.calc .keys button:active{ transform:scale(.97); }
.calc .keys button.op{ background:var(--surface-3); }
.calc .keys button.eq{ background:var(--accent); color:#fff; border-color:transparent; }
.calc .keys button.fn{ font-size:13.5px; color:var(--text-2); }

/* ---- Paint ---- */
.paint{ display:flex; flex-direction:column; height:100%; }
.paint .tools{ display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.paint .canvas-wrap{ flex:1; overflow:auto; background:repeating-conic-gradient(var(--surface-3) 0 25%,var(--surface-2) 0 50%) 0 0/20px 20px; display:grid; place-items:center; padding:20px; }
.paint canvas{ background:#fff; box-shadow:var(--shadow-sm); cursor:crosshair; touch-action:none; }
.paint .pal{ display:grid; grid-template-columns:repeat(10,18px); gap:3px; }
.paint .pal button{ width:18px; height:18px; border-radius:4px; border:1px solid var(--border-2); }
.paint .cur-col{ width:30px; height:30px; border-radius:6px; border:2px solid var(--border-2); position:relative; overflow:hidden; }
.paint .cur-col input{ position:absolute; inset:-6px; width:44px; height:44px; border:0; padding:0; opacity:0; }

/* ---- Photos / media ---- */
.photos{ display:flex; flex-direction:column; height:100%; background:#111; color:#eee; }
.photos .stage{ flex:1; overflow:hidden; display:grid; place-items:center; position:relative; }
.photos .stage img{ max-width:100%; max-height:100%; transition:transform .2s; user-select:none; -webkit-user-drag:none; }
.photos .bar{ display:flex; justify-content:center; align-items:center; gap:4px; padding:6px; background:rgba(0,0,0,.4); }
.photos .bar .ibtn{ color:#eee; }
.photos .nav{ position:absolute; top:50%; margin-top:-24px; width:44px; height:48px; border:0; border-radius:8px; background:rgba(0,0,0,.35); color:#fff; display:grid; place-items:center; opacity:0; transition:opacity .2s; }
.photos .stage:hover .nav{ opacity:1; }
.media{ display:flex; flex-direction:column; height:100%; background:#0d0d12; color:#eee; }
.media .vis{ flex:1; display:grid; place-items:center; position:relative; overflow:hidden; min-height:0; }
.media video{ max-width:100%; max-height:100%; }
.media canvas.viz{ position:absolute; inset:0; width:100%; height:100%; }
.media .art{ width:170px; height:170px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,#ff4f8b,#7c4dff); box-shadow:0 20px 60px rgba(124,77,255,.4); position:relative; z-index:1; }
.media .art svg{ width:72px; height:72px; stroke:#fff; }
.media .ctl{ padding:10px 16px 12px; background:rgba(255,255,255,.04); }
.media .ctl .ibtn{ color:#eee; }
.media .seek{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:#aaa; }
.media .seek input{ flex:1; }
.media .pl{ width:240px; border-left:1px solid rgba(255,255,255,.08); overflow:auto; padding:8px; }
.media .pl .it{ padding:7px 10px; border-radius:6px; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.media .pl .it:hover{ background:rgba(255,255,255,.08); }
.media .pl .it.on{ color:var(--accent); background:rgba(var(--accent-rgb),.12); }

/* ---- Task manager ---- */
.tm{ display:flex; height:100%; }
.tm .sidebar{ width:180px; }
.tm .page{ flex:1; overflow:auto; padding:16px 20px; }
.tm table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.tm th{ text-align:left; font-weight:500; color:var(--text-3); padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:-16px; background:var(--win-bg); }
.tm td{ padding:7px 8px; border-bottom:1px solid var(--border); }
.tm tr.sel td{ background:rgba(var(--accent-rgb),.15); }

.tm td .appicon{ --s:18px; margin-right:8px; vertical-align:middle; }
.tm .graphs{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.tm .graph{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px; }
.tm .graph canvas{ width:100%; height:120px; display:block; }
.tm .graph .h{ display:flex; justify-content:space-between; margin-bottom:8px; font-size:12.5px; }
.tm .graph .h b{ font-weight:600; }

.compat-console .ok{ color:#7ee787; } .compat-console .wr{ color:#e3b341; } .compat-console .er{ color:#ff7b72; } .compat-console .in{ color:#79c0ff; } .compat-console .dm{ color:#6e7681; }

.win32 .sb{ border-top:1px solid #ccc; padding:3px 8px; color:#444; background:#f0f0f0; }
.gtkapp{ flex:1; display:flex; flex-direction:column; background:#fafafa; color:#2e3436; font-family:"Cantarell","Ubuntu",sans-serif; font-size:13px; }

/* =====================================================================
   Motion layer — spring curves come from JS (--spring, --spring-soft,
   --spring-bouncy); fallbacks below. Only transform/opacity/filter animate.
   ===================================================================== */
:root{ --spring:cubic-bezier(.34,1.36,.64,1); --spring-soft:cubic-bezier(.22,1,.36,1); --spring-bouncy:cubic-bezier(.34,1.8,.64,1); --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.55,0,.9,.4); }
.win.opening,.win.closing{ animation:none!important; }
.win.lifted{ box-shadow:0 40px 100px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.3)!important; }
.win .tbar,.win .tbar .ttl,.win .tbar .tico{ transition:background .35s var(--ease-out),opacity .35s var(--ease-out),color .35s; }
.win .tbar .tctl button{ transition:background .2s var(--ease-out),color .2s,transform .5s var(--spring-bouncy); }
.win .tbar .tctl button:active{ transform:scale(.86); }
.flyout{ transform:translateY(28px) scale(.96); transform-origin:50% 100%; filter:blur(6px); transition:opacity calc(.22s * var(--spd)) var(--ease-out),transform calc(.32s * var(--spd)) var(--ease-in),filter calc(.25s * var(--spd)) var(--ease-out); will-change:transform,opacity; }
.flyout.open{ transform:none; filter:none; transition:opacity calc(.3s * var(--spd)) var(--ease-out),transform calc(.7s * var(--spd)) var(--spring),filter calc(.35s * var(--spd)) var(--ease-out); }
#calendar-fly,#quick-fly{ transform-origin:100% 100%; }
.ctx{ animation:ctxIn calc(.5s * var(--spd)) var(--spring) both; }
.ctx.out{ animation:ctxOut calc(.15s * var(--spd)) var(--ease-in) forwards; }
@keyframes ctxIn{ from{ opacity:0; transform:scale(.82); filter:blur(4px); } }
@keyframes ctxOut{ to{ opacity:0; transform:scale(.94); } }
.ctx .mi,.ctx .sep{ animation:miIn calc(.42s * var(--spd)) var(--ease-out) both; animation-delay:calc(var(--i,0) * 14ms * var(--spd)); }
@keyframes miIn{ from{ opacity:0; transform:translateY(-6px); } }

function appIconHTML(app, size) {

  const [a, b] = app.colors || ["#5b8cff", "#7b5cff"];
  const lum = c => { const [r, g, bb] = hexToRgb(c).map(v => { v /= 255; return v <= .04 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * bb; };
  const dk = (lum(a) + lum(b)) / 2 > .42;
  return `<span class="appicon${dk ? " dk" : ""}" style="${st}background:linear-gradient(135deg,${a},${b})">${`<svg viewBox="0 0 24 24">${GLYPHS[app.icon] || GLYPHS.file}</svg>`}</span>`;
}

const MIME = { txt: "text/plain", md: "text/markdown", json: "application/json", js: "text/javascript", css: "text/css", html: "text/html", htm: "text/html", svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", bmp: "image/bmp", ico: "image/x-icon", mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", m4a: "audio/mp4", flac: "audio/flac", mp4: "video/mp4", webm: "video/webm", mov: "video/quicktime", mkv: "video/x-matroska", pdf: "application/pdf", exe: "application/x-msdownload", zip: "application/zip", sh: "text/x-shellscript", bat: "text/plain", py: "text/x-python", xml: "text/xml", log: "text/plain" };

/* Shortcut (.lnk) files: JSON {target:"app:id" | "path:/x" | "url:https://"} */
const Shortcuts = {
  parse(node) { try { const t = JSON.parse(typeof node.content === "string" ? node.content : new TextDecoder().decode(node.content)); return t.target ? t : null; } catch (e) { return null; } },
  resolve(v) { if (FS.exists(v)) return v; const m = v.match(/^\/home\/[^/]+(\/.*)?$/); return m ? FS.home + (m[1] || "") : v; },

<script>
/* =====================================================================
   UI primitives — context menus, dialogs, notifications, tooltips, pickers
   ===================================================================== */
const Menu = {
  stack: [],
  show(x, y, items, opts = {}) {

  },

  _outside(e) { if (!e.target.closest(".ctx")) Menu.closeAll(); },
  _open(x, y, items, level, opts) {
    const ox = x, oy = y;

    const el = h(`<div class="ctx" role="menu"></div>`);
    items.filter(Boolean).forEach((it) => {
      if (it === "-") { el.appendChild(h(`<div class="sep"></div>`)); return; }
      const icon = it.checked != null ? (it.checked ? `<span class="chk">${ic("check")}</span>` : "") : (it.iconHTML || (it.icon ? ic(it.icon) : ""));
      const mi = h(`<div class="mi${it.disabled ? " dis" : ""}${it.danger ? " danger" : ""}" role="menuitem"><span class="ic">${icon}</span><span class="lb">${esc(it.label)}</span>${it.kbd ? `<span class="kb">${esc(it.kbd)}</span>` : ""}${it.sub ? `<span class="ar">${ic("chevR")}</span>` : ""}</div>`);
      if (it.sub) {
        const openSub = () => { $$(".mi.hl", el).forEach(m => m.classList.remove("hl")); mi.classList.add("hl"); const r = mi.getBoundingClientRect(); this._open(r.right - 4, r.top - 5, typeof it.sub === "function" ? it.sub() : it.sub, level + 1, opts); };
        mi.addEventListener("pointerenter", () => { clearTimeout(this._t); this._t = setTimeout(openSub, 120); });
        mi.addEventListener("click", openSub);
      } else {
        mi.addEventListener("pointerenter", () => { clearTimeout(this._t); this._t = setTimeout(() => { while (this.stack.length > level + 1) this.stack.pop().remove(); $$(".mi.hl", el).forEach(m => m.classList.remove("hl")); }, 150); });
        mi.addEventListener("click", (e) => { e.stopPropagation(); this.closeAll(); Sound.play("click"); try { it.action && it.action(); } catch (err) { console.error(err); Dialog.alert("Error", err.message, { icon: "errorC" }); } });
      }
      el.appendChild(mi);
    });
    el.addEventListener("contextmenu", e => e.preventDefault());
    document.body.appendChild(el);
    const r = el.getBoundingClientRect(); const W = innerWidth, H = innerHeight;
    if (x + r.width > W - 4) x = level ? x - r.width - (this.stack[level - 1]?.getBoundingClientRect().width || 0) + 8 : W - r.width - 4;
    if (y + r.height > H - 4) y = Math.max(4, H - r.height - 4);
    el.style.left = Math.max(4, x) + "px"; el.style.top = Math.max(4, y) + "px";
    el.style.transformOrigin = `${clamp(ox - Math.max(4, x), 0, r.width)}px ${clamp(oy - Math.max(4, y), 0, r.height)}px`;
    $$(".mi,.sep", el).forEach((m, i) => m.style.setProperty("--i", i));
    this.stack.push(el);
    return el;
  },
  closeAll() { clearTimeout(this._t); this.stack.forEach(e => { e.classList.add("out"); e.style.pointerEvents = "none"; setTimeout(() => e.remove(), 160); }); this.stack = []; document.removeEventListener("pointerdown", this._outside, true); window.removeEventListener("blur", this._blur); },
  open() { return this.stack.length > 0; },
  /* Show a menu anchored below an element */
  at(el, items, opts) { const r = el.getBoundingClientRect(); this.show(opts?.up ? r.left : r.left, opts?.up ? r.top - 8 : r.bottom + 4, items, opts); if (opts?.up && this.stack[0]) { const m = this.stack[0]; m.style.top = Math.max(4, r.top - m.offsetHeight - 6) + "px"; } },
};
document.addEventListener("keydown", e => {
  if (!Menu.open()) return;
  const m = Menu.stack[Menu.stack.length - 1]; const items = $$(".mi:not(.dis)", m); const cur = items.findIndex(i => i.classList.contains("hl"));
  if (e.key === "Escape") { Menu.closeAll(); e.preventDefault(); e.stopPropagation(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); items.forEach(i => i.classList.remove("hl")); const n = (cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[n]?.classList.add("hl"); }
  else if (e.key === "Enter" && cur >= 0) { e.preventDefault(); e.stopPropagation(); items[cur].click(); }
  else if (e.key === "ArrowLeft" && Menu.stack.length > 1) { Menu.stack.pop().remove(); e.preventDefault(); }
  else if (e.key === "ArrowRight" && cur >= 0) { items[cur].click(); e.preventDefault(); }

/* ---------------- Dialogs ---------------- */
const Dialog = {
  open({ title = "", message = "", icon = null, iconColor, body = null, buttons = [{ label: "OK", primary: true, value: true }], wide = false, onMount, cancelValue = null }) {
    return new Promise(resolve => {
      const layer = $("#modal-layer");
      const bd = h(`<div class="backdrop"></div>`);
      const icHTML = icon ? `<div class="dic" style="color:${iconColor || { alert: "var(--warn)", errorC: "var(--danger)", help: "var(--accent)", info: "var(--accent)", checkC: "var(--ok)" }[icon] || "var(--accent)"}">${ic(icon)}</div>` : "";
      const dlg = h(`<div class="dialog${wide ? " wide" : ""}" role="dialog"><div class="dbody">${icHTML}<div class="grow"><h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ""}<div class="dslot"></div></div></div><div class="dfoot"></div></div>`);
      if (body) { const slot = $(".dslot", dlg); if (typeof body === "string") slot.innerHTML = body; else slot.appendChild(body); }
      const foot = $(".dfoot", dlg);
      let done = false;
      const close = (v) => { if (done) return; done = true; bd.classList.add("out"); setTimeout(() => bd.remove(), 200); document.removeEventListener("keydown", key, true); resolve(v); };
      buttons.forEach(b => { const btn = h(`<button class="btn${b.primary ? " primary" : ""}${b.danger ? " danger" : ""}">${esc(b.label)}</button>`); btn.onclick = () => { const v = typeof b.value === "function" ? b.value(dlg) : b.value; if (v === undefined && b.keepOpen) return; close(v); }; foot.appendChild(btn); });
      const key = (e) => {
        if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); close(cancelValue); }
        else if (e.key === "Enter" && !e.target.matches("textarea")) { const p = buttons.find(b => b.primary); if (p) { e.preventDefault(); e.stopPropagation(); const v = typeof p.value === "function" ? p.value(dlg) : p.value; close(v); } }
      };
      document.addEventListener("keydown", key, true);
      bd.addEventListener("pointerdown", e => { if (e.target === bd) { dlg.classList.remove("shake"); void dlg.offsetWidth; dlg.classList.add("shake"); } });
      bd.appendChild(dlg); layer.appendChild(bd);
      onMount && onMount(dlg, close);

  },
  alert(title, message, o = {}) { return this.open({ title, message, icon: o.icon || "info", ...o }); },
  confirm(title, message, o = {}) { return this.open({ title, message, icon: o.icon || "help", buttons: [{ label: o.cancel || "Cancel", value: false }, { label: o.ok || "OK", primary: !o.danger, danger: o.danger, value: true }], cancelValue: false, ...o }); },
  prompt(title, message, def = "", o = {}) {
    return this.open({ title, message, icon: o.icon, body: `<input class="input" style="width:100%;margin-top:12px" type="${o.type || "text"}" placeholder="${esc(o.placeholder || "")}" value="${esc(def)}">`, buttons: [{ label: "Cancel", value: null }, { label: o.ok || "OK", primary: true, value: d => $("input", d).value }], ...o });
  },
};

/* ---------------- Notifications ---------------- */
const Notify = {
  list: [],
  push({ app = "settings", title = "", body = "", actions = [], timeout = 6000, silent = false, iconHTML }) {
    const n = { id: uid(), app, title, body, time: Date.now(), iconHTML };
    this.list.unshift(n); this.list = this.list.slice(0, 50); Bus.emit("notifs");
    if (Settings.get("dnd")) return n;
    if (!silent) Sound.play("notify");
    const t = h(`<div class="toast">${iconHTML || appIconHTML(app)}<div class="grow"><div class="t">${esc(title)}</div><div class="b">${esc(body)}</div>${actions.length ? `<div class="acts"></div>` : ""}</div><button class="x">${ic("x")}</button></div>`);
    actions.forEach(a => { const b = h(`<button class="btn sm${a.primary ? " primary" : ""}">${esc(a.label)}</button>`); b.onclick = (e) => { e.stopPropagation(); a.action(); dismiss(); }; $(".acts", t).appendChild(b); });
    const dismiss = () => { t.classList.add("out"); setTimeout(() => t.remove(), 260); };
    $(".x", t).onclick = (e) => { e.stopPropagation(); dismiss(); };
    t.onclick = () => { dismiss(); if (Apps[app]) launch(app); };
    $("#toasts").appendChild(t);
    let timer = setTimeout(dismiss, timeout);
    t.onmouseenter = () => clearTimeout(timer); t.onmouseleave = () => timer = setTimeout(dismiss, 2500);

  clear() { this.list = []; Bus.emit("notifs"); },
  remove(id) { this.list = this.list.filter(n => n.id !== id); Bus.emit("notifs"); },

function notify(title, body, app = "settings", extra = {}) { return Notify.push({ title, body, app, ...extra }); }

/* ---------------- Tooltips ---------------- */
(() => {
  let tip = null, timer = null;
  document.addEventListener("pointerover", e => {
    const t = e.target.closest("[data-tip]"); clearTimeout(timer);
    if (!t) { tip && tip.remove(); tip = null; return; }
    timer = setTimeout(() => {
      tip && tip.remove(); if (!document.body.contains(t)) return;
      tip = h(`<div class="tooltip">${esc(t.dataset.tip)}</div>`); document.body.appendChild(tip);

  });

/* ---------------- File picker (Open / Save As / Folder) ---------------- */
const FilePicker = {
  open({ title = "Open", mode = "open", start, name = "", filters = null, filterLabel = "All files" } = {}) {
    return new Promise(resolve => {
      let cwd = start && FS.isDir(start) ? FS.norm(start) : FS.home + "/Documents";
      if (!FS.isDir(cwd)) cwd = FS.home;
      let selected = null;
      const body = h(`<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
        <div class="row"><button class="ibtn up" data-tip="Up one level">${ic("arrowU")}</button><input class="input grow path" spellcheck="false"><button class="ibtn nf" data-tip="New folder">${ic("folderPlus")}</button></div>
        <div style="display:flex;height:300px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <div class="side" style="width:150px;overflow:auto;padding:6px;background:var(--surface);border-right:1px solid var(--border)"></div>
          <div class="items" style="flex:1;overflow:auto;padding:4px"></div>
        </div>
        <div class="row"><span class="muted" style="width:80px">${mode === "folder" ? "Folder" : "File name"}</span><input class="input grow fname" spellcheck="false" ${mode === "folder" ? "readonly" : ""}><span class="chip">${esc(filterLabel)}</span></div>
      </div>`);
      const places = [["Home", FS.home, "home"], ["Desktop", FS.home + "/Desktop", "monitor"], ["Documents", FS.home + "/Documents", "fileText"], ["Downloads", FS.home + "/Downloads", "download"], ["Pictures", FS.home + "/Pictures", "image"], ["Music", FS.home + "/Music", "music"], ["Videos", FS.home + "/Videos", "video"], ["This PC", "/", "laptop"]];
      $(".side", body).innerHTML = places.map(([n, p, i]) => `<div class="navitem" data-p="${esc(p)}">${ic(i)}<span>${n}</span></div>`).join("");
      const render = () => {
        $(".path", body).value = cwd;
        $$(".side .navitem", body).forEach(n => n.classList.toggle("on", n.dataset.p === cwd));
        const items = FS.list(cwd).filter(i => !i.name.startsWith(".")).filter(i => i.node.type === "dir" || (mode !== "folder" && (!filters || filters.includes(extOf(i.name))))).sort((a, b) => (a.node.type === "dir" ? 0 : 1) - (b.node.type === "dir" ? 0 : 1) || a.name.localeCompare(b.name));
        $(".items", body).innerHTML = items.length ? items.map(i => `<div class="navitem" data-n="${esc(i.name)}" style="height:30px">${fileIconHTML(i.name, i.node, i.path, 18)}<span class="ellipsis grow">${esc(i.name)}</span><span class="dim" style="font-size:11.5px">${i.node.type === "dir" ? "" : fmtSize(FS.sizeOf(i.node))}</span></div>`).join("") : `<div class="empty-state" style="height:100%">${ic("folder")}This folder is empty</div>`;
        $$(".items .navitem", body).forEach(el => {
          const nm = el.dataset.n, p = FS.join(cwd, nm), isDir = FS.isDir(p);
          el.onclick = () => { $$(".items .navitem", body).forEach(x => x.classList.remove("on")); el.classList.add("on"); selected = p; if (!isDir || mode === "folder") $(".fname", body).value = nm; };
          el.ondblclick = () => { if (isDir) { cwd = p; selected = null; render(); } else finish(p); };
        });
        if (mode === "folder") $(".fname", body).value = FS.basename(cwd);
      };
      let closeFn;
      const finish = async (p) => {
        if (mode === "folder") { closeFn(selected && FS.isDir(selected) ? selected : cwd); return; }
        const nm = $(".fname", body).value.trim(); if (!p && !nm) return;

      };

      $(".nf", body).onclick = async () => { const n = await Dialog.prompt("New folder", "", "New folder"); if (n) { try { FS.mkdir(FS.join(cwd, n)); render(); } catch (e) { Dialog.alert("Error", e.message, { icon: "errorC" }); } } };
      $(".path", body).onkeydown = e => { if (e.key === "Enter") { e.stopPropagation(); e.preventDefault(); const p = FS.norm(e.target.value); if (FS.isDir(p)) { cwd = p; render(); } } };
      $$(".side .navitem", body).forEach(n => n.onclick = () => { cwd = n.dataset.p; render(); });
      $(".fname", body).value = name;
      render();
      Dialog.open({
        title, body, wide: true, cancelValue: null,
        buttons: [{ label: "Cancel", value: null }, { label: mode === "save" ? "Save" : mode === "folder" ? "Select folder" : "Open", primary: true, keepOpen: true, value: () => { finish(); return undefined; } }],

  async runInTerminal(path, print) {

  },

/* Tiny markdown renderer (Notepad preview & reader mode) */
function mdToHTML(md) {
  const lines = String(md).replace(/\r/g, "").split("\n"); let out = "", inCode = false, list = null, para = [];
  const inline = s => esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2" style="max-width:100%">').replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2">$1</a>').replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>").replace(/~~([^~]+)~~/g, "<s>$1</s>");
  const flush = () => { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const endList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const l of lines) {
    if (/^```/.test(l)) { flush(); endList(); out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { out += esc(l) + "\n"; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { flush(); endList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-*+]\s+(\[[ xX]\]\s+)?(.*)/))) { flush(); if (list !== "ul") { endList(); out += "<ul>"; list = "ul"; } out += `<li>${m[1] ? `<input type="checkbox" disabled ${/x/i.test(m[1]) ? "checked" : ""}> ` : ""}${inline(m[2])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flush(); if (list !== "ol") { endList(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^>\s?(.*)/))) { flush(); endList(); out += `<blockquote style="border-left:3px solid #8884;margin:8px 0;padding:2px 12px;color:#888">${inline(m[1])}</blockquote>`; }
    else if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flush(); endList(); out += "<hr>"; }
    else if (!l.trim()) { flush(); endList(); }
    else para.push(l);
  }
  flush(); endList(); if (inCode) out += "</code></pre>"; return out;
}

  dec(n) { if (n.type === "dir") { for (const k in n.children) n.children[k] = this.dec(n.children[k]); return n; } if (n.content && n.content.__b64) { const s = atob(n.content.__b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); n.content = u.buffer; } return n; },
  export() { const data = JSON.stringify({ axos: AXOS_VERSION, date: Date.now(), settings: Settings.data, fs: this.enc(FS.root), bookmarks: BrowserData.bookmarks }); download(`axos-backup-${new Date().toISOString().slice(0, 10)}.json`, data, "application/json"); },

    inp.click();

        <h3>Personal AxProxy gateway (recommended)</h3><div class="srow stack"><div class="d muted" style="font-size:12.5px;line-height:1.55">Public gateways are shared and rate-limited, so they're slow and fail often. A free Cloudflare Worker gives you your own gateway: faster, no rate limits, real form posts, and logins that keep cookies.<ol style="margin:8px 0 10px 18px;padding:0"><li>Click <b>Copy gateway code</b>.</li><li>Open the Cloudflare dashboard → <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Create Worker</b> → <b>Deploy</b>.</li><li>Click <b>Edit code</b>, replace everything with the copied code, then <b>Deploy</b>.</li><li>Paste the worker's address (like <code>https://axproxy.you.workers.dev</code>) below.</li></ol></div><div class="row" style="flex-wrap:wrap"><button class="btn wcopy">${ic("copy")} Copy gateway code</button><button class="btn wcf">${ic("external")} Open Cloudflare</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><input class="input grow" data-btext="workerUrl" value="${esc(b.workerUrl || "")}" placeholder="https://axproxy.your-name.workers.dev" style="min-width:220px"><input class="input" data-btext="workerKey" value="${esc(b.workerKey || "")}" placeholder="Key (optional)" style="width:150px"><button class="btn wtest">Test</button></div><div class="wres dim" style="font-size:12px;margin-top:6px"></div></div>

    const render = () => {

    };
    const wire = () => {
      $$("[data-go]", P).forEach(e => e.onclick = () => go(e.dataset.go));
      $$("[data-set]", P).forEach(e => e.onclick = () => { Settings.set(e.dataset.set, !S(e.dataset.set)); e.classList.toggle("on"); if (["airplane", "wifi"].includes(e.dataset.set)) render(); });
      $$("[data-bset]", P).forEach(e => e.onclick = () => { Settings.patch("browser", { [e.dataset.bset]: !S("browser")[e.dataset.bset] }); e.classList.toggle("on"); });
      $$("[data-range]", P).forEach(e => e.oninput = () => Settings.set(e.dataset.range, +e.value));
      $$("[data-sel]", P).forEach(e => e.onchange = () => { const k = e.dataset.sel; let v = e.value; if (/^-?[\d.]+$/.test(v)) v = +v; if (k.startsWith("b.")) { Settings.patch("browser", { [k.slice(2)]: v }); if (k === "b.gateway") render(); } else Settings.set(k, v); });
      $$("[data-btext]", P).forEach(e => e.onchange = () => Settings.patch("browser", { [e.dataset.btext]: e.value.trim() }));
      $$("[data-wp]", P).forEach(e => e.onclick = () => { Settings.set("wallpaper", e.dataset.wp); render(); });
      $$("[data-acc]", P).forEach(e => e.onclick = () => { Settings.set("accent", e.dataset.acc); render(); });
      const ac = $(".acc-custom", P); if (ac) ac.onchange = () => { Settings.set("accent", ac.value); render(); };
